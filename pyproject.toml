[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-agent-workspace"
version = "0.1.1"
description = "桌面 Agent 工作区内核：一个目录约定、一条 dispatch、一条事件流、一份能力面"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agent Workspace contributors" }]
keywords = ["agent", "aaas", "desktop", "pywebview", "workspace", "plugins"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: User Interfaces",
]
# 桌面窗口（pywebview）是**默认**形态，所以它是必需依赖，不再是 extra：
# 装完就有窗口，不该再让人去补一条 `pip install ...[gui]` 才能看见界面。
# 它缺失时的退化（--browser / --cli）仍然保留 —— 那防的是"装了但坏了"，不是"没装"。
dependencies = ["aaas>=0.3.0", "pywebview>=5.0"]

[project.optional-dependencies]
# 空 extra：老命令 `pip install open-agent-workspace[gui]` 仍然成立（不报未知 extra）。
# 它现在等于空气，因为没有额外的东西可装。
gui = []

[project.scripts]
# 只留这一个入口名：PyPI 上另有一个 agent-workspace（dropxhq 的 Rust 内核），
# 我们再占 agent-workspace 这个脚本名，就会在用户的 Scripts/ 里和它互相覆盖。
open-agent-workspace = "agentworkspace.main:main"

[project.urls]
Homepage = "https://github.com/YY-Yifei/agent-workspace"
Source = "https://github.com/YY-Yifei/agent-workspace"
Issues = "https://github.com/YY-Yifei/agent-workspace/issues"

[tool.setuptools.packages.find]
# 用 find 而不是手写清单：以后 agentworkspace/ 下多一个子包（比如 assets/），
# 忘了改 pyproject 就会静默打不进 wheel
include = ["agentworkspace*"]
# namespaces 默认 true：那样没有 __init__.py 的目录（如 assets/）也会被当成命名空间包
# 打进 wheel，和 package-data 的意图不一样
namespaces = false

[tool.setuptools.package-data]
agentworkspace = ["web/*.html", "assets/*.ico"]
