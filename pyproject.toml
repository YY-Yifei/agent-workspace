[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workspace"
version = "0.1.0"
description = "桌面 Agent 工作区内核：一个目录约定、一条 dispatch、一条事件流、一份能力面"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agent Workspace contributors" }]
keywords = ["agent", "aaas", "desktop", "pywebview", "workspace", "plugins"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = ["aaas>=0.3.0"]

[project.optional-dependencies]
# 桌面窗口那层壳。不装也能用：--browser（浏览器）与 --cli（命令行）都不需要它
gui = ["pywebview>=5.0"]

[project.scripts]
agent-workspace = "agentworkspace.main:main"

[tool.setuptools]
packages = ["agentworkspace"]

[tool.setuptools.package-data]
agentworkspace = ["web/*.html", "assets/*.ico"]
