[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workspace-desktop"
version = "0.1.0"
description = "桌面 Agent 工作区内核：一个目录约定、一条 dispatch、一条事件流、一份能力面"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agent Workspace contributors" }]
keywords = ["agent", "aaas", "desktop", "pywebview", "workspace", "plugins"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = ["aaas>=0.3.0"]

[project.optional-dependencies]
# 桌面窗口那层壳。不装也能用：--browser（浏览器）与 --cli（命令行）都不需要它
gui = ["pywebview>=5.0"]

[project.scripts]
agent-workspace = "agentworkspace.main:main"

[project.urls]
Homepage = "https://github.com/YY-Yifei/agent-workspace"
Source = "https://github.com/YY-Yifei/agent-workspace"
Issues = "https://github.com/YY-Yifei/agent-workspace/issues"

[tool.setuptools.packages.find]
# 用 find 而不是手写清单：以后 agentworkspace/ 下多一个子包（比如 assets/），
# 忘了改 pyproject 就会静默打不进 wheel
include = ["agentworkspace*"]
# namespaces 默认 true：那样没有 __init__.py 的目录（如 assets/）也会被当成命名空间包
# 打进 wheel，和 package-data 的意图不一样
namespaces = false

[tool.setuptools.package-data]
agentworkspace = ["web/*.html", "assets/*.ico"]
