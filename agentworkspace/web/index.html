  }).then((x) => x.json()).catch((err) => ({ status: 'bad', error: String(err) }));
  btn.disabled = false;
  if (!r || r.status !== 'ok') { setHint((r && r.error) || '保存失败', 'bad'); return; }
  S.settings = { url: r.url, theme: r.theme || theme };
  themeOpening = null;              // 已落盘：关面板不必再还原
  applyTheme(S.settings.theme);
  $('#aaasurl').value = r.url;
  const n = (r.reconnected || []).length;
  setHint(`已保存 · ${r.url !== oldUrl
    ? (n ? `正在用新地址重连 ${n} 个程序` : '还没有程序连过，下次说话时连')
    : '外观已记下'}`, 'ok');
  await syncAgents();
  paintConn();
}

/* 点一下就该变：外观是「看一眼才知道」的东西，不给人先存后看。 */
$('#themeseg').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-theme-pref]');
  if (b) applyTheme(b.dataset.themePref);
});
$('#setcancel').onclick = closeSettings;
$('#setform').onsubmit = saveSettings;
$('#mask').addEventListener('click', (e) => { if (e.target.id === 'mask') closeSettings(); });
$('#vclose').onclick = closeVersions;
$('#vmask').addEventListener('click', (e) => { if (e.target.id === 'vmask') closeVersions(); });
/* 会话面板与它们同一套骨架，就该有同一套「怎么关」：Esc、点窗外。
   上一版只有「关闭」按钮能关 —— 点遮罩、按 Esc 都没有反应，而这两条正是
   所有浮层默认该有的路（人不会先去找按钮）。 */
$('#smask').addEventListener('click', (e) => { if (e.target.id === 'smask') closeSessions(); });
$('#lb').addEventListener('click', closePhoto);
window.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  closePhoto();         // 大图在最上层：先关它，别一次把底下的面板也关掉
  closeVersions();      // 版本面板在上层，先关它
  closeSessions();
  closeSettings();
});

/* ------------------------------------------------------- 选中复制（三）：Ctrl+C */
/* 为什么需要这层兜底：pywebview 把 `AreBrowserAcceleratorKeysEnabled` 绑在它自己的
 * debug 上（platforms/edgechromium.py），我们的窗口不是 debug，于是它默认是 False
 * —— Ctrl+C / Ctrl+A 在 WebView2 里根本不派发。外壳已经在 loaded 时把它打开
 * （shell.open_copy_doors），但那是 WebView2 专有的设置：换平台、老版本包装不上、
 * 或者哪天有人把 create_window 的参数改回去，这里必须还有一条路。
 *
 * 三个边界，写在这里而不是等踩：
 *   1) **不 preventDefault**：原生那条路若开着，它复制的是同一段文字，重复一次无害；
 *      先拦掉再自己写，反而会在 clipboard API 失败时把本来能成的原生复制一起废掉。
 *   2) 输入框里自己有选区时不接管：那里的复制由浏览器编辑命令负责，比我们准。
 *   3) 写剪贴板失败要有第二条路：execCommand('copy') 虽然过时，但它不需要额外权限，
 *      而 127.0.0.1 是安全上下文，navigator.clipboard 正常可用 —— 两条都留着。
 */
let threadDirty = false;          // 因为「正在选中」而欠下的那一帧

function copySelection() {
  const a = document.activeElement;
  // 输入框/文本框里的选区归浏览器管；这里只看「页面文字」的选区
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')
      && a.selectionStart !== a.selectionEnd) return false;
  const sel = window.getSelection ? window.getSelection() : null;
  const text = sel ? String(sel) : '';
  if (!text) return false;
  writeClipboard(text);
  return true;
}

/* 先试异步 API，再退回老命令。两条都失败就只留一句 warn —— 别假装成功。 */
function writeClipboard(text) {
  const legacy = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    if (!ok) console.warn('[copy] 剪贴板写入失败');
    return ok;
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(legacy);
    return;
  }
  legacy();
}

document.addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  if (e.key !== 'c' && e.key !== 'C') return;
  copySelection();
});

/* 选区消失（松手后点一下、或按 Esc）：把欠下的帧补画一次。
   只补「真的欠过」的那一帧 —— 否则每次点击都会重画整条 thread。 */
document.addEventListener('selectionchange', () => {
  if (!threadDirty) return;
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) return;
  threadDirty = false;
  paintThread();
});

/* ------------------------------------------------------------------ 启动 */
function select(pid) {
  if (!prog(pid)) pid = (S.programs[0] || {}).id;
  S.pid = pid;
  location.hash = pid ? `#p/${pid}` : '';
  paintRail();
  paintStage(true);
}

/* 委托绑在 #stage 上：它自己不被替换，里面的 thread 换多少次都还在。 */
$('#stage').addEventListener('click', onThreadClick);
window.addEventListener('resize', () => {
  const sp = $('.split');
  if (sp) sp.style.setProperty('--chatw', clampChatW(chatW(S.pid), sp.clientWidth) + 'px');
});

(async function boot() {
  await loadState();
  const want = location.hash.replace(/^#\/?p\//, '') ||
    ((S.programs.find((p) => p.id === 'assistant') || S.programs[0] || {}).id);
  select(want);
  const es = new EventSource('/api/events');
  es.onopen = () => { syncAgents(); };        // 首连 + 断线重连都走这里
  es.onmessage = (e) => { try { on(JSON.parse(e.data)); } catch (err) { /* 一条坏事件不该掀桌 */ } };
})();
</script>
