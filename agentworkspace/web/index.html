<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Workspace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%235aa2ff'/%3E%3Crect x='10' y='12' width='11' height='40' rx='5' fill='%23fff'/%3E%3Crect x='26' y='17' width='28' height='11' rx='5' fill='%23fff'/%3E%3Crect x='26' y='36' width='28' height='11' rx='5' fill='%23fff'/%3E%3C/svg%3E">
<script>
/* 首帧的主题。真源在 config.json（/api/state.settings.theme），但那是异步的：
   等它回来再换色，浅色的人开机时会先闪一下深色。所以把**上一次解析出来的**
   结果（只剩 dark / light 两档）存在 localStorage 当缓存，先贴上去；
   state 一到，applyTheme() 按真源重贴一次 —— 缓存只负责「第一帧别难看」，
   它永远不是第二份真源（换台机器、换个人改设置，以 config.json 为准）。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('aw-theme'); } catch (e) { /* 存不上就读系统 */ }
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches)
      ? 'light' : 'dark';
  }
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
  :root{
    --bg:#0e1013; --panel:#14171b; --line:#22272e; --ink:#e6eaef; --dim:#8b949e;
    --bubble:#1c2128; --accent:#5aa2ff; --ok:#4bbd7a; --bad:#e0645b;
    /* 停止键的底与边：与 --bad 同色系的低透明度两档。写死 rgba 的话，
       浅色主题上会拿到一个"深色主题的红"，与同一行字的 color 不是一家。 */
    --stop-bg:rgba(224,100,91,.12); --stop-line:rgba(224,100,91,.42);
    /* 开发者开关「开」的轨道：accent 的半透明底色。**不能**用 opacity 做淡 ——
       滑块是轨道的 ::after，透明度作用在整棵子树上，滑块会跟着一起被削掉。 */
    --dev-on-bg:rgba(90,162,255,.34);
    /* 滚动条三档：--sb 是**热区**（能抓住的宽度），视觉粗细由 thumb 的透明
       边框削掉；两档可见度 —— 静止时只是边界，鼠标压上去才是控件。 */
    /* 两档刻度按 WCAG 1.4.11 的非文本对比 3:1 定，而且是**算过**的：
         暗 静止 .62 → 3.08:1    悬停 .8  → 4.36:1
         浅 静止 .80 → 3.13:1    悬停 .95 → 4.10:1
       上一版写 .55，实测只有 2.67:1 —— 注释里写着 3:1，其实是空话，而没人会去手算。
       滚动条是"这个容器还能滚"的唯一提示，太淡就等于没有。细（视觉 4px）+
       半透明仍然安静，但不该隐形。 */
    --sb:10px; --sb-thumb:rgba(139,148,158,.62); --sb-thumb-hi:rgba(139,148,158,.8);
    /* 这一行是"治本"：默认滚动条不受页面 CSS 影响，但受 color-scheme 影响。
       没有它，即使写了下面的伪元素，未覆盖的地方（以及 iframe 里的原生控件）
       仍会被画成浅色。 */
    color-scheme:dark;
  }
  /* 浅色：**只此一处**。旧版靠 @media 跟随系统 —— 那等于「关不掉」，而设置里
     既然有了三档，深浅就只认一个判据：<html data-theme="dark|light">。
     谁写上去？头顶那段开机脚本负责首帧，之后由 applyTheme() 维护；CSS 自己
     **不再看 @media** —— 两条判据并存时，「设成深色的人被系统切浅」这种事故
     迟早会在某个边角上重演。 */
  :root[data-theme="light"]{
    --bg:#f6f7f9; --panel:#fff; --line:#e5e7eb; --ink:#171a1f; --dim:#6b7280;
    --bubble:#eef0f3; --accent:#2563eb; --ok:#1f9d55; --bad:#d13b30;
    --stop-bg:rgba(209,59,48,.08); --stop-line:rgba(209,59,48,.38);
    --dev-on-bg:rgba(37,99,235,.24);
    --sb-thumb:rgba(107,114,128,.8); --sb-thumb-hi:rgba(107,114,128,.95);
    color-scheme:light;
  }
  *{box-sizing:border-box}
  /* 滚动条。系统默认那一条是画给"文档"的：17px 宽、浅灰凹槽、两头各一个
     箭头按钮 —— 放在 #0e1013 上，它比任何内容都亮，这就是违和的来源。
     四处处置：
       1) 箭头按钮归零、corner 透明（默认样式里最扎眼的两处）；
       2) 滑块用 3px 透明边框把 10px 热区削成 4px 视觉：细，但仍抓得住；
       3) 静止 .62 / 悬停拖动 .8 —— 不滚动时它只是容器边缘的一道影子；
       4) Firefox 兜底用 `@supports (-moz-appearance:none)` 当门。
          反过来拿 `@supports not selector(::-webkit-scrollbar)` 当门有风险：
          碰上"声称支持该伪元素却又不画它"的引擎会两头落空，而 Gecko 正好
          在这条线上模糊。`-moz-` 属性只有 Gecko 认，零误伤。
     ⚠ 这里**不能**出现裸的 scrollbar-width/scrollbar-color：Chromium 121+ 一旦
       看到它们就整段忽略 ::-webkit-scrollbar，圆角与"悬停才亮"会当场全丢。
     ⚠ 悬停档用 background-color 而不是 background：简写会把 background-clip
       重置回 border-box，滑块会在悬停那一瞬间由 4px 胖成 10px。 */
  ::-webkit-scrollbar{width:var(--sb);height:var(--sb);background:transparent}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background-color:var(--sb-thumb);border-radius:99px;
    border:3px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background-color:var(--sb-thumb-hi)}
  ::-webkit-scrollbar-thumb:active{background-color:var(--sb-thumb-hi)}
  ::-webkit-scrollbar-button{display:none;width:0;height:0}
  ::-webkit-scrollbar-corner{background:transparent}
  @supports (-moz-appearance:none){
    /* Gecko 的 thumb 没有 :hover/:active —— 上面那套"静止一档、压上去一档"
       在这里会塌成永久静止档，于是所有容器的滚动条都停在最淡的那一档。
       没有第二档可升，就只能让第一档就是亮的：直接给 --sb-thumb-hi。 */
    *{scrollbar-width:thin;scrollbar-color:var(--sb-thumb-hi) transparent}
    /* 56px 的栏里塞不下 Gecko 的 thin（8–11px），图标会被挤歪；而 Gecko 又没有
       2px 这一档。取舍：这里不要可见的栏 —— scrollbar-width:none 只隐藏 UI，
       滚轮与键盘照样滚，代价是「栏还能往下滚」在 Gecko 上没有视觉提示。
       （桌面壳走 WebView2/Chromium，那一路是 8px 热区 + 2px 视觉，有提示。） */
    #rail{scrollbar-width:none}
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  #app{display:flex;height:100%}

  /* 左：一条窄栏。只有图标 —— 程序的名字在悬停里，不在界面上 */
  /* 程序装多了这一栏会溢出，而它是 overflow:visible —— 最后一个图标会被裁掉，
     连个滚动条都没有。给它滚。
     两个尺寸必须分开：热区 8px（鼠标抓得住），视觉 2px（由全局那条 3px 透明边框
     从 8px 里削出来）。写 width:3px 会让热区也变成 3px —— 看得见、点不中，
     那只是把"丑"换成了"不能操作"。
     gutter 常驻：溢出出现/消失时 38px 的图标不会横跳。 */
  #rail{width:56px;flex:0 0 56px;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:10px 0;background:var(--panel);border-right:1px solid var(--line);
    overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable}
  /* ⚠ 只加 overflow-y:auto 换不来「装多了就滚」：flex 列里子项默认 flex-shrink:1，
     溢出时它们会先被压到 min-content（38px 的图标缩成 ~19px），滚动条根本轮不到
     出现。把主尺寸钉死，溢出的才是真溢出。（.grow{flex:1} 的 basis 是 0，不受影响） */
  #rail .rbtn{flex:0 0 auto}
  /* 窄栏只需要一条规则：把**宽度**收窄。颜色、圆角、那圈 3px 透明边框
     全部继承全局那条 —— 所以这里只出现 width，特异性不出这个属性之外，
     全局的 :hover 档照样生效。
     （曾经这里还写了一条 thumb{background-color:…}，与全局一字不差、纯 no-op，
       却把特异性抬到 (1,0,1)，于是又得补一条悬停覆盖回来。两条冗余都是它生的。）
     也**不要**在这里写 border:0 —— 那会把热区与视觉都压成 8px。 */
  #rail::-webkit-scrollbar{width:8px}
  .rbtn{width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--ink);
    font-size:19px;line-height:1;cursor:pointer;display:grid;place-items:center;
    transition:background .12s}
  .rbtn:hover{background:var(--bubble)}
  .rbtn.on{background:var(--bubble);box-shadow:inset 2px 0 0 var(--accent)}
  .grow{flex:1}
  /* 小绿点不在栏上了：它说的是「连上没连上」，而没连上的原因就在设置页那个
     输入框里。放在一起，点和那句话才读得懂。 */
  .stat{display:flex;align-items:flex-start;gap:8px}
  .stat .hint{flex:1 1 auto;min-width:0}
  .sdot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:0 0 8px;
    margin-top:5px}
  .sdot.ok{background:var(--ok)} .sdot.bad{background:var(--bad)}
  .sdot.wait{background:var(--accent)}

  /* 右：舞台。两栏 = 程序页 + 对话；只有对话的程序，对话占满 */
  #stage{flex:1;min-width:0;display:flex;overflow:hidden}
  .split{display:flex;flex:1;min-width:0}
  .pane{flex:1 1 auto;min-width:240px;display:flex;flex-direction:column;overflow:hidden;
    background:var(--panel)}
  .pane iframe{flex:1;width:100%;border:0;background:transparent}
  .native{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;padding:28px;text-align:center;color:var(--dim)}
  .native b{color:var(--ink);font-weight:600;font-size:15px}
  /* 对话面板的宽度是一个变量：拖着走就是它，刷新还是它 */
  .chat{flex:0 0 var(--chatw,380px);width:var(--chatw,380px);min-width:280px;
    max-width:calc(100% - 240px);display:flex;flex-direction:column;background:var(--bg)}
  .solo .chat{flex:1 1 auto;width:auto;max-width:none}
  /* 中缝：6px 的抓手。宽度谁说了算，人自己定 —— 不是我们替他挑一个比例 */
  .gutter{flex:0 0 6px;cursor:col-resize;background:transparent;position:relative;outline:none}
  .gutter::before{content:"";position:absolute;inset:0 2px;background:var(--line);
    border-radius:3px;transition:background .12s}
  .gutter:hover::before,.gutter:focus-visible::before,.gutter.drag::before{background:var(--accent)}
  .chat header{display:flex;align-items:baseline;gap:8px;padding:12px 16px;
    border-bottom:1px solid var(--line);font-size:13px;color:var(--dim)}
  .chat header b{color:var(--ink);font-weight:600;font-size:13px;white-space:nowrap;
    flex:0 0 auto}
  /* 标题不许折行：加了开关之后中文会被挤成一列字（真截图里踩到的）。
     要缩的是描述，不是名字。 */
  .chat header span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    min-width:0;flex:1 1 auto}
  /* 开发者模式：一枚开关，不是一页设置。放不下就不解释，悬停给一句话 */
  .dev{margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    font-size:12px;color:var(--dim);user-select:none;white-space:nowrap}
  .dev input{display:none}
  .dev i{width:26px;height:15px;border-radius:9px;background:var(--line);position:relative;
    transition:background .15s;flex:0 0 26px}
  .dev i::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;
    border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
  .dev.on{color:var(--accent)}
  /* 上一版是 `background:var(--accent);opacity:.4`：透明度把滑块一起削到 40%，
     于是「开」态是一条纯蓝胶囊 —— 看不出它滑到哪边，也就看不出开没开。
     淡还给轨道（半透明底色），滑块保持实心：两档亮度分开，形状才读得出来。 */
  .dev.on i{background:var(--dev-on-bg)}
  .dev.on i::after{transform:translateX(11px);background:var(--accent)}
  /* scrollbar-gutter:stable —— 流式输出时每来一段都会让滚动条出现一次，
     没有它正文会跟着左右抖 10px。位置定死，抖动就消失。
     不用 both-edges：那会让正文左边缘比 header 和输入框各多缩 10px（26 vs 16）。
     一列字的左基线对齐，比"左右对称"重要。 */
  #thread{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px;
    scrollbar-gutter:stable}
  .solo #thread{max-width:720px;margin:0 auto;width:100%}
  /* 选中复制（一）：把「能不能选」这件事钉死在对话区上。
     pywebview 的 customize.js 在 text_select=False 时会往 <head> **末尾**追加
     `body{-webkit-user-select:none;cursor:default}`。它特异性只有 (0,0,1)，
     但后写者赢 —— 所以这里必须用 id 选择器（1,0,0）压住它。
     不加这一条，症状只是「复制不了」，很难往桌面外壳上想（第二十三轮的真账）。
     为什么不写 `*{user-select:text}`：那会连 .dev 开关这类「本来就不该选中」的
     标签一起放开。对话正文与对话框里的说明，才是人要带走的东西。 */
  #thread,.dlg{user-select:text;-webkit-user-select:text;cursor:auto}
  .msg{width:100%;max-width:100%}
  /* 一句话 + 几张图 = **一竖列**，整块靠右。
     上一版是 `display:flex;justify-content:flex-end`（横排），于是正文与图成了
     两个并排的 flex 项：文字被挤成一根窄柱在左、图在右一列 —— 既不像「我发的」，
     也把整行撑满。图从来不是正文的兄弟，是它的下一行。 */
  .msg.me{display:flex;flex-direction:column;align-items:flex-end}
  .msg .body{white-space:pre-wrap;word-break:break-word}
  .msg.me .body{background:var(--bubble);padding:8px 12px;border-radius:12px;max-width:86%}
  /* 没送出去的那一句（人切了程序，草稿放不回去）：虚线 + 淡，别把它画成「说过的话」 */
  .msg.me.failed .body{background:transparent;border:1px dashed var(--dim);color:var(--dim)}
  .msg .body.dim{color:var(--dim)}
  /* 只有**智能体说的话**走这块排版（.body.md）。人说的话仍是 pre-wrap 原文，
     工具返回的正文也不进来 —— 那是命令输出与日志，必须等宽、必须一字不动。 */
  .msg .body.md{white-space:normal}
  .md>*:first-child{margin-top:0}
  .md>*:last-child{margin-bottom:0}
  .md p{margin:8px 0}
  .md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:14px 0 6px;line-height:1.35;font-weight:600}
  .md h1{font-size:18px} .md h2{font-size:16px} .md h3{font-size:15px}
  .md h4,.md h5,.md h6{font-size:14px;color:var(--dim)}
  .md ul,.md ol{margin:6px 0;padding-left:22px}
  .md li{margin:2px 0}
  .md li>ul,.md li>ol{margin:2px 0}
  /* white-space 必须给行内 code 自己一份：父级 .md 是 normal，它会继承下去，
     于是 `printf("a  b")` 里的两个空格被折成一个 —— 行内代码最要命的就是空格失真。
     块级那一路由 .md pre code 的 pre 兜住（特异性更高，长行照旧横向滚动）。 */
  .md code{font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
    font-size:12.5px;background:var(--bubble);padding:1px 5px;border-radius:4px;
    white-space:pre-wrap;word-break:break-word}
  .md pre{margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    background:var(--bubble);overflow:auto}
  .md pre code{background:transparent;padding:0;font-size:12.5px;white-space:pre;
    word-break:normal;display:block}
  .md blockquote{margin:8px 0;padding:2px 0 2px 12px;border-left:2px solid var(--line);
    color:var(--dim)}
  .md hr{border:0;border-top:1px solid var(--line);margin:12px 0}
  .md a{color:var(--accent);text-decoration:none}
  .md a:hover{text-decoration:underline}
  .md table{border-collapse:collapse;margin:8px 0;font-size:13px;display:block;
    overflow:auto;max-width:100%}
  .md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
  .md th{background:var(--bubble);font-weight:600}
  .md .task{color:var(--dim)} .md .task.done{color:var(--ok)}
  .md del{opacity:.7}
  /* 工具调用：默认**一行**。
     一轮里可能有二十次调用，全摊开就是拿执行日志当聊天记录 ——
     注意力被吃掉，人真正要读的那句话反而找不到。 */
  .tgroup{margin-top:10px}
  .tgh{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;
    padding:2px 0;color:var(--dim);font:inherit;font-size:12px;cursor:pointer;text-align:left;
    min-width:0}
  .tgh:hover{color:var(--ink)}
  .tgh .chev{flex:0 0 auto;display:inline-block;font-size:9px;opacity:.75;
    transition:transform .15s}
  .tgroup.open .tgh .chev{transform:rotate(90deg)}
  .tgh .sum{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .tgh .st{flex:0 0 auto;margin-left:auto;font-size:11px;color:var(--dim)}
  .tgh .st.run{color:var(--accent)}
  .tlist{display:none;margin:4px 0 0;padding-left:10px;border-left:1px solid var(--line)}
  .tgroup.open .tlist{display:block}
  .tool{margin:1px 0;font-size:12px;color:var(--dim)}
  .tool .th{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;
    padding:3px 0;color:inherit;font:inherit;font-size:12px;cursor:pointer;text-align:left;
    min-width:0}
  .tool .th:hover{color:var(--ink)}
  .tool .t{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    min-width:0;flex:1 1 auto}
  .tool .st{flex:0 0 auto;font-size:11px;color:var(--ok)}
  .tool .st.run{color:var(--accent)} .tool .st.bad{color:var(--bad)}
  .tool .r{display:none;margin:4px 0 8px;padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--panel);white-space:pre-wrap;word-break:break-word;
    max-height:160px;overflow:auto;color:var(--dim)}
  .tool.open .r{display:block}
  /* 带图的输入区：预览条在上、输入行在下。加一行不改位置 —— 只是把
     「这一张要不要发」摆在发送键旁边，而不是藏在某处设置里。 */
  .composer{display:flex;flex-direction:column;gap:8px;padding:12px 16px;
    border-top:1px solid var(--line)}
  .crow{display:flex;gap:8px;align-items:flex-end}
  .solo .composer{max-width:720px;margin:0 auto;width:100%}
  /* 待发的图：小、可删、看得清。× 在角上而不是列表里 —— 删的是**那一张**。 */
  .pends{display:none;gap:8px;flex-wrap:wrap}
  .pends .pk{position:relative}
  .pends img{height:56px;border-radius:8px;border:1px solid var(--line);
    object-fit:cover;display:block;cursor:zoom-in}
  .pends .pk button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;
    padding:0;border-radius:50%;font-size:12px;line-height:1;background:var(--panel);
    color:var(--ink);border:1px solid var(--line);cursor:pointer}
  /* 缩略图 120px：够认出是哪张，又不至于两张就把一屏吃掉。真要看清楚就点开
     （#lb 那张整屏的暗底）—— 缩略图不该假装自己就是原图。 */
  .msg.me .shots{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;
    max-width:100%;justify-content:flex-end}
  .msg.me .shots img{max-width:120px;max-height:120px;border-radius:8px;
    border:1px solid var(--line);display:block;cursor:zoom-in}
  .composer textarea{flex:1;resize:none;min-height:40px;max-height:160px;padding:10px 12px;
    border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);
    font:inherit;outline:none}
  .composer textarea:focus{border-color:var(--accent)}
  .composer button{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
  .composer button.p{background:var(--accent);border-color:var(--accent);color:#fff}
  /* 停止键不是「发送」的变体，是**另一个动作**：同一个位置上换装，
     形状、尺寸、位置一个字都不改 —— 布局不许跳。 */
  .composer button.stop{color:var(--bad);border-color:var(--stop-line);
    background:var(--stop-bg)}
  /* 两档「不能按」：发送中… / 正在停止…。它们不是灰色不可用，是**进行中** ——
     用文字说清楚，别让人以为是卡住了。 */
  .composer button.p.busy{background:var(--bubble);border-color:var(--line);color:var(--dim)}
  .composer button.stop.busy{opacity:.6}
  .composer button:disabled{cursor:default}
  /* 停止 = 撤回：这一轮从上下文里退回去了，界面上塌成一枚记号。
     虚线边 + 低饱和 + 小一号 —— 一眼看出它**不是对话的一部分**；
     但它仍然在：人还得知道「刚才那一轮发生过，只是不算数」。 */
  .retract{margin:2px 0;padding:8px 10px;border:1px dashed var(--line);border-radius:10px;
    color:var(--dim);font-size:12px;line-height:1.5}
  .retract .rh{display:flex;align-items:center;gap:6px}
  .retract .ri{color:var(--bad);font-size:13px}
  .retract .sp{flex:1 1 auto}
  .retract .rq{margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .retract button{height:22px;padding:0 8px;border-radius:7px;border:1px solid var(--line);
    background:transparent;color:var(--dim);font:inherit;font-size:12px;cursor:pointer}
  .retract button:hover{color:var(--ink);border-color:var(--dim)}
  .retract .rb{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
  /* 展开之后那半句：**加删除线** —— 它存在过，但它不算话。 */
  .retract .rb .body{text-decoration:line-through;opacity:.7}
  /* 动效只负责「收」那一下：内容塌进记号。关掉动效的人直接看到结果，
     而不是看到一个不动的过渡态。 */
  @media (prefers-reduced-motion: no-preference){
    .retract{animation:rIn .18s ease-out}
    @keyframes rIn{from{opacity:0;transform:scaleY(.94)}to{opacity:1;transform:none}}
  }
  .empty{flex:1;display:grid;place-items:center;color:var(--dim);font-size:13px}
  /* 拖进来的那一刻得有个落点：不然「拖了没反应」和「拖了但不收」长得一模一样。 */
  .composer.drag{background:var(--bubble);box-shadow:inset 0 0 0 2px var(--accent)}

  /* 设置入口在左下角：它管的是「整个工作区连哪个道」，不是某一个程序的事。
     所以它不和程序挤在同一列里 —— 中间用一道分隔线分开。 */
  #rail .sep{width:26px;height:1px;background:var(--line);margin:6px 0 2px;flex:0 0 1px}
  /* 设置面板：整个工作区只有一页，眼下只有一项。不做「设置中心」。 */
  #mask{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;
    place-items:center;z-index:40}
  #mask.on{display:grid}
  .dlg{width:440px;max-width:calc(100% - 40px);background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:18px 20px 16px;display:flex;flex-direction:column;gap:12px;
    box-shadow:0 24px 60px rgba(0,0,0,.35)}
  .dlg h3{margin:0;font-size:15px;font-weight:600}
  .dlg label{font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:6px}
  .dlg input{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);
    color:var(--ink);font:inherit;font-size:13px;outline:none}
  .dlg input:focus{border-color:var(--accent)}
  .dlg .hint{font-size:12px;color:var(--dim);min-height:16px;line-height:1.4;
    word-break:break-all}
  .dlg .hint.bad{color:var(--bad)} .dlg .hint.ok{color:var(--ok)}
  .dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:2px}
  .dlg .acts button{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
  .dlg .acts button.p{background:var(--accent);border-color:var(--accent);color:#fff}
  .dlg .acts button[disabled]{opacity:.6;cursor:default}
  /* 外观三档：一排等宽按钮，选中那个亮着。不做下拉 —— 三档一眼看得全，下拉
     要点两下才知道里面有几档；也不做开关 —— 开关只有两档，而「跟随系统」
     正是默认那档，它比「深」「浅」都更常被选中。 */
  .dlg .field{display:flex;flex-direction:column;gap:6px}
  .dlg .field > span{font-size:12px;color:var(--dim)}
  .seg{display:flex;gap:6px}
  .seg button{flex:1 1 0;height:32px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:var(--dim);font:inherit;font-size:13px;cursor:pointer}
  .seg button:hover{color:var(--ink);border-color:var(--dim)}
  .seg button.on{background:var(--bubble);border-color:var(--accent);color:var(--ink)}
  /* 版本面板：与设置面板同一套骨架（#mask/.dlg），只多一个可滚动的列表。
     列表自己滚，标题与按钮不动 —— 版本多了也不会把「关闭」推出视野。 */
  /* 会话面板复用同一套骨架（#mask/.dlg + .vrow）：它是同一类东西 ——
     一列可滚动的行，每行右侧几个动作。多造一套样式只会多一处要同步维护的漂移。 */
  #vmask,#smask{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;
    place-items:center;z-index:41}
  #vmask.on,#smask.on{display:grid}
  /* 看大图：整屏暗底，点任意处 / Esc 关掉。它不改任何状态，只是一次「看清楚」。 */
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;place-items:center;
    padding:24px;z-index:42;cursor:zoom-out}
  #lb.on{display:grid}
  #lb img{max-width:100%;max-height:100%;border-radius:8px;
    box-shadow:0 24px 60px rgba(0,0,0,.5)}
  /* 行内改名：不弹 prompt —— pywebview 的 prompt 支持与否取决于版本，
     弹不出来就是「点了没反应」。直接就地变成输入框。 */
  .sren{width:100%;box-sizing:border-box;background:var(--bg);color:var(--ink);
    border:1px solid var(--accent);border-radius:6px;padding:2px 6px;
    font:inherit;font-size:13px;font-weight:600}
  .vdlg{width:560px;max-height:calc(100% - 80px)}
  .vlist{overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:60px}
  .vrow{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;
    border:1px solid var(--line);border-radius:10px;background:var(--bg)}
  .vrow.cur{border-color:var(--accent)}
  .vrow .vmain{flex:1 1 auto;min-width:0}
  .vrow .vno{font-weight:600;font-size:13px;color:var(--ink)}
  .vrow .vmeta{font-size:11px;color:var(--dim);margin-top:2px;word-break:break-all}
  .vrow .vfiles{font-size:11px;color:var(--dim);margin-top:3px;word-break:break-all}
  .vrow button{flex:0 0 auto;height:28px;padding:0 10px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;
    font-size:12px;cursor:pointer}
  .vrow button:hover{border-color:var(--accent);color:var(--accent)}
  .vrow button[disabled]{opacity:.55;cursor:default}
  /* 会话行：**整行就是「切过去」**，右边只留两个动作。
     三个按钮并排（切过去 / 改名 / 删除）每行都要读一遍，而「切过去」在当前那一行
     永远是按不动的 —— 一个按不动的按钮不是信息，是噪音。当前会话改用一个词说清。 */
  .vrow.srow{cursor:pointer;align-items:center}
  .vrow.srow:hover{border-color:var(--accent)}
  .vrow .scur{flex:0 0 auto;font-size:11px;color:var(--accent)}
  .vrow .sact{height:24px;padding:0 8px;border-radius:7px;border:1px solid transparent;
    background:transparent;color:var(--dim);font:inherit;font-size:12px;cursor:pointer}
  .vrow .sact:hover{color:var(--ink);border-color:var(--line)}
  .vrow .sact.dele:hover{color:var(--bad);border-color:var(--stop-line)}
  .vrow .sact.dele.confirm{color:var(--bad);border-color:var(--stop-line);
    background:var(--stop-bg)}
  /* 入口按钮：和「开发者」开关同一行，靠右。它不改变任何状态，只是打开一页。 */
  .vbtn{flex:0 0 auto;height:26px;padding:0 10px;border-radius:8px;
    border:1px solid var(--line);background:transparent;color:var(--dim);font:inherit;
    font-size:12px;cursor:pointer}
  .vbtn:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <nav id="rail" aria-label="程序"></nav>
  <main id="stage"><div class="empty">正在连上…</div></main>
</div>
<div id="mask" aria-hidden="true">
  <form class="dlg" id="setform">
    <h3>设置</h3>
    <div class="field">
      <span>外观</span>
      <div class="seg" id="themeseg" role="radiogroup" aria-label="外观">
        <button type="button" role="radio" data-theme-pref="auto">跟随系统</button>
        <button type="button" role="radio" data-theme-pref="dark">深色</button>
        <button type="button" role="radio" data-theme-pref="light">浅色</button>
      </div>
    </div>
    <label for="aaasurl">aaas-service 地址
      <input id="aaasurl" spellcheck="false" autocomplete="off"
             placeholder="ws://localhost:8888/">
    </label>
    <div class="stat"><i class="sdot" id="setdot" aria-hidden="true"></i>
      <span class="hint" id="setstat"></span></div>
    <div class="hint" id="setmsg"></div>
    <div class="acts">
      <button type="button" id="setcancel">取消</button>
      <button type="submit" class="p" id="setsave">保存并重连</button>
    </div>
  </form>
</div>
<div id="vmask" aria-hidden="true">
  <div class="dlg vdlg" role="dialog" aria-label="版本历史">
    <h3 id="vtitle">版本历史</h3>
    <div class="vlist" id="vlist"></div>
    <div class="hint" id="vmsg"></div>
    <div class="acts">
      <button type="button" id="vclose">关闭</button>
    </div>
  </div>
</div>
<div id="smask" aria-hidden="true">
  <div class="dlg vdlg" role="dialog" aria-label="会话">
    <h3 id="stitle">会话</h3>
    <div class="vlist" id="slist"></div>
    <div class="hint" id="smsg"></div>
    <div class="acts">
      <button type="button" id="snew">新建会话</button>
      <button type="button" id="sclose">关闭</button>
    </div>
  </div>
</div>
<div id="lb" aria-hidden="true"><img alt="看大图"></div>
<script src="/web/turn.js"></script>
<script src="/web/md.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* 全部状态就这一个对象：程序清单、每个程序的对话、每个程序的连接情况。
   没有第二份「界面状态」—— 界面是它的投影，不是它的所有者。 */
const S = {
  programs: [], agents: {}, native: {}, devtools: null, pid: null,
  stitle: {},        // 每个程序当前会话的标题（悬停里那句「当前会话：…」）
  settings: { url: '', theme: 'auto' },   // theme: auto | dark | light
  vcs: { enabled: false, reason: '' },   // 版本化开关（内核没装 pure-python-git 时为 false）
  msgs: {},       // pid → [{role:'me'|'it', text, tools:[{label,status,text}]}]
  cur: {},        // pid → 当前这一轮那条消息的下标
  tick: {},       // pid → 被事件碰过几次（用来判断 /api/state 的快照是否已过期）
  sid: {},        // pid → 当前会话号（磁盘上那份对话的名字）
  pend: {},       // pid → 待发送的图 [{blob,url,name}]（还没随任何一轮出去）
  railSig: '', stageKey: '', busy: {},
  phase: {},      // pid → idle|sending|running|stopping（判据全在 turn.js）
};

const prog = (pid) => S.programs.find((p) => p.id === pid);
const msgs = (pid) => (S.msgs[pid] || (S.msgs[pid] = []));

function push(pid, m) { msgs(pid).push(m); if (pid === S.pid) paintThread(); return m; }
function curIt(pid) {
  let i = S.cur[pid];
  if (i == null || !msgs(pid)[i] || msgs(pid)[i].role !== 'it') {
    i = msgs(pid).push({ role: 'it', text: '', tools: [] }) - 1;
    S.cur[pid] = i;
  }
  return msgs(pid)[i];
}

/* ------------------------------------------------------------------ 状态 */
async function loadState() {
  // 快照是**取的时候**的事实，不是「回来的时候」的事实：await 会把控制权交给
  // SSE，这期间可能已经推进了一轮。判据与 syncAgents 同一条 —— 这个 pid 的 tick
  // 变过，就说明事件流已经在负责它，快照让位。
  const tick0 = { ...S.tick };
  const st = await fetch('/api/state').then((r) => r.json()).catch(() => null);
  if (!st) return null;
  S.programs = st.programs || [];
  S.native = st.native || {};
  S.devtools = st.devtools || null;   // 只为工具卡写清「谁在动手」，不进左侧栏
  S.settings = st.settings || S.settings;   // 两项：连哪个道（url）+ 什么外观（theme）
  applyTheme(S.settings.theme);             // 真源到了就重贴：缓存只管第一帧
  S.vcs = st.vcs || S.vcs;                  // 版本化是否可用：门只搬运，不重新发明
  for (const [pid, a] of Object.entries(st.agents || {})) {
    if ((S.tick[pid] || 0) !== (tick0[pid] || 0)) continue;   // 这份快照已经过期
    S.agents[pid] = { status: a.status, error: a.error, busy: a.busy };
    S.sid[pid] = a.sid || S.sid[pid];      // 当前会话号：切会话时要知道「现在在哪」
    setPhase(pid, { type: 'snapshot', busy: !!a.busy });
    if (!S.msgs[pid]) {                      // 只补一次：之后的增量在事件里
      S.msgs[pid] = groupRetracted((a.history || []).map((h) => ({
        role: h.role === 'user' ? 'me' : 'it', text: h.text || '', tools: [],
        files: h.files || [],
        turn: h.turn || '', retracted: !!h.retracted,
      })));
    }
  }
  return st;
}

/* 把一个程序的智能体叫起来（幂等）：打开面板时做一次，不在开机时做几十次 */
async function warm(pid) {
  const tick0 = S.tick[pid] || 0;
  const a = await fetch(`/api/p/${pid}/link`, { method: 'POST' })
    .then((r) => r.json()).catch(() => null);
  // 同 syncAgents：快照在 await **之前**取，回来时可能已经过期。一个「不忙」的
  // 旧快照盖在刚到的 turn.started 上，闸门就开了 —— 那正是这一轮要防的连发。
  if (a && a.status && (S.tick[pid] || 0) === tick0) {
    S.agents[pid] = { status: a.status, error: a.error, busy: a.busy };
    setPhase(pid, { type: 'snapshot', busy: !!a.busy });   // 另一个窗口可能在跑
    paintConn();
  }
}

/* ------------------------------------------------------------------ 左侧窄栏 */
function paintRail() {
  const sig = S.programs.map((p) => p.id + (p.icon || '')).join(',') + '|' + S.pid;
  if (sig === S.railSig) return;
  S.railSig = sig;
  const rail = $('#rail');
  /* 窄栏现在是滚动容器：`innerHTML` 一换，scrollTop 就归零 —— 程序多到要滚时，
     点一个靠下的图标会让整条栏跳回顶部，刚选中的那个当场从视野里消失。
     位置先记后放；选中项**只在看不见时**才滚进视口（block:'nearest' 是最小移动，
     已经看得见就一步也不动）。 */
  const keepTop = rail.scrollTop;
  rail.innerHTML = S.programs.map((p) =>
    `<button class="rbtn${p.id === S.pid ? ' on' : ''}" data-pid="${p.id}"
             title="${esc(p.title)}">${esc(p.icon || (p.title || '?').slice(0, 1))}</button>`
  ).join('') + `<div class="grow"></div>
    <div class="sep"></div>
    <button class="rbtn" id="setbtn" title="设置（外观 · aaas-service 地址）"
            aria-label="设置">⚙</button>`;
  rail.querySelectorAll('.rbtn[data-pid]').forEach((b) => {
    b.onclick = () => select(b.dataset.pid);
  });
  $('#setbtn').onclick = openSettings;
  rail.scrollTop = keepTop;
  /* 别把这个变量叫 `on`：本脚本顶层有个事件分发器 `on(ev)`，同名会在函数里把它
     遮住 —— 今天不在这儿调它所以不报错，明天谁在这里写一句 on(...) 就是 TypeError。 */
  const sel = rail.querySelector('.rbtn.on');
  if (sel) {
    const rb = rail.getBoundingClientRect(), sb2 = sel.getBoundingClientRect();
    if (sb2.top < rb.top || sb2.bottom > rb.bottom) sel.scrollIntoView({ block: 'nearest' });
  }
  paintConn();
}

/* 连接状态只有一个画法：点与那句话**由同一次汇总算出**。
   弹窗没开时没有可画的地方 —— 那就什么都不画，而不是画到看不见的地方去。 */
function paintConn() {
  const dot = $('#setdot'), el = $('#setstat');
  if (!dot || !el) return;
  let ready = 0, connecting = 0, err = '';
  for (const a of Object.values(S.agents || {})) {
    if (!a) continue;
    if (a.status === 'ready') ready++;
    else if (a.status === 'connecting') connecting++;
    else if (a.status === 'error' && !err) err = a.error || '未知原因';
  }
  const st = ready ? 'ok' : (connecting ? 'wait' : (err ? 'bad' : ''));
  dot.className = 'sdot' + (st ? ' ' + st : '');
  dot.title = ready ? `已连上（${ready} 个程序）` : (err || '还没有程序连过');
  el.textContent = ready ? `当前：已连上（${ready} 个程序）`
    : connecting ? '当前：正在连接…'
    : err ? `当前：连不上 —— ${err}`
    : '当前：还没有程序连过（说一句话就会连）';
  el.className = 'hint' + (ready ? ' ok' : (err ? ' bad' : ''));
}

/* ------------------------------------------------------------------ 舞台 */
function paintStage(force) {
  const p = prog(S.pid);
  const nat = S.native[S.pid] || {};
  const key = [S.pid, p && p.uiKind, p && p.title, nat.status || '', nat.title || ''].join('|');
  if (key === S.stageKey && !force) { paintThread(); return; }
  S.stageKey = key;
  const stage = $('#stage');
  if (!p) { stage.innerHTML = '<div class="empty">还没有程序。跟小助理说一句，让它造一个。</div>'; return; }

  const solo = p.id === 'assistant' || p.uiKind === 'none';
  let pane = '';
  if (!solo) {
    if (p.uiKind === 'web') {
      pane = `<div class="pane"><iframe id="appframe" src="/plugin/${p.id}/"
                     title="${esc(p.title)}"></iframe></div>`;
    } else {
      const running = nat.status === 'running';
      pane = `<div class="pane"><div class="native">
        <b>${esc(p.title)}</b>
        <div>这个程序开自己的窗口 —— 属于桌面，不在这个面板里。</div>
        <div>
          <button class="rbtn" style="width:auto;padding:0 14px;height:34px;font-size:13px"
                  id="natbtn">${running ? '关掉它的窗口' : '打开它的窗口'}</button>
        </div>
      </div></div>`;
    }
  }
  const gutter = solo ? '' : `<div class="gutter" id="gutter" role="separator"
      aria-orientation="vertical" tabindex="0"
      title="拖动调整宽度（双击复位，←/→ 微调）"></div>`;
  stage.innerHTML = `<div class="split${solo ? ' solo' : ''}">${pane}${gutter}
    <aside class="chat">
      <header>${esc(p.icon || '')}<b>${esc(p.title)}</b><span>${esc(p.description || '')}</span>
        <button type="button" class="vbtn" id="sessbtn" title="会话：新建 / 切换 / 改名 / 删除">会话</button>
        ${p.id === 'assistant' ? '' : `<label class="dev${p.dev ? ' on' : ''}" title="打开后它能读写工作区里的文件、改自己的代码（碰不到别的程序）"><input type="checkbox" id="devsw"${p.dev ? ' checked' : ''}><i></i>开发者</label><button type="button" class="vbtn" id="verbtn" title="看这个程序的版本历史 / 退回去">版本</button>`}
      </header>
      <div id="thread"></div>
      <form class="composer" id="composer">
        <div class="pends" id="pends"></div>
        <div class="crow">
          <button type="button" id="pickb" title="加一张图（也可以直接粘贴或拖进来）">图</button>
          <textarea id="ta" rows="1" placeholder="${esc(ph(p))}"></textarea>
          <button class="p" id="sendb" type="button">发送</button>
        </div>
        <input type="file" id="pickf" accept="image/*" multiple hidden>
      </form>
    </aside></div>`;
  wireComposer();
  wireDev();
  wireVersions();
  wireSessions();
  wireGutter();
  if (p.uiKind === 'native') {
    $('#natbtn').onclick = () => toggleNative(p.id, (S.native[p.id] || {}).status === 'running');
  }
  paintThread();
  warm(p.id);
}

function wireDev() {
  const box = $('#devsw');
  if (!box) return;
  box.onchange = () => toggleDev(S.pid, box.checked);
}

/* ------------------------------------------------------------------ 版本 */
/* 版本面板是**人**这一侧的「看一眼 / 退回去」。它不发明语义：
   GET 拿到的就是内核的版本链，POST 的语义是「把那一版再提交一次」——
   所以退回去之后历史里多一版，而不是少几版。
   不弹 confirm：回退本身可逆（再退回来就行），这是设计里的一条不变量；
   而 pywebview 的 confirm 支持与否取决于版本，弹不出来就是「点了没反应」。 */
function wireVersions() {
  const b = $('#verbtn');
  if (!b) return;
  b.onclick = () => openVersions(S.pid);
}

function setVHint(text, cls) {
  const el = $('#vmsg');
  if (!el) return;
  el.textContent = text || '';
  el.className = 'hint' + (cls ? ' ' + cls : '');
}

async function openVersions(pid) {
  const m = $('#vmask');
  if (!m) return;
  m.classList.add('on');
  m.setAttribute('aria-hidden', 'false');
  $('#vtitle').textContent = `${(prog(pid) || {}).title || pid} · 版本历史`;
  setVHint('读取中…');
  $('#vlist').innerHTML = '';
  const r = await fetch(`/api/p/${pid}/versions`).then((x) => x.json())
    .catch((err) => ({ error: String(err) }));
  if (r.error) { setVHint(r.error, 'bad'); return; }
  if (!r.enabled) {
    setVHint(`版本化未启用：${r.reason || '未安装 pure-python-git'}`, 'bad');
    return;
  }
  const rows = r.versions || [];
  if (!rows.length) {
    setVHint('还没有任何版本：这个程序下一次被写入成功时会记第 1 版。');
    return;
  }
  setVHint((r.truncated
    ? `只显示最近 ${rows.length} 版（更早的还有）。`
    : `共 ${rows.length} 版（最新在前）。`)
    + '「退回去」= 把那一版再提交一次，历史不会少。');
  $('#vlist').innerHTML = rows.map((v, i) => `
    <div class="vrow${i === 0 ? ' cur' : ''}">
      <div class="vmain">
        <div class="vno">v${v.ver} <span class="vmeta">${esc(v.short)} · ${esc(v.when)}</span></div>
        <div class="vmeta">${esc(v.msg || '（无摘要）')}</div>
        <div class="vfiles">${(v.files || []).map(esc).join(' · ') || '—'}</div>
      </div>
      <button type="button" data-ver="v${v.ver}"${i === 0 ? ' disabled title="这就是当前这一版"' : ''}>退回去</button>
    </div>`).join('');
  $('#vlist').querySelectorAll('button[data-ver]').forEach((b) => {
    b.onclick = () => doRevert(pid, b.dataset.ver, b);
  });
}

async function doRevert(pid, version, btn) {
  btn.disabled = true;
  setVHint(`正在退回到 ${version}…`);
  const r = await fetch(`/api/p/${pid}/versions`, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ version }),
  }).then((x) => x.json()).catch((err) => ({ status: 'error', message: String(err) }));
  if (!r || r.status !== 'ok') {
    btn.disabled = false;
    setVHint((r && r.message) || '回退失败', 'bad');
    return;
  }
  setVHint(r.message || '已回退', 'ok');
  await loadState();
  paintStage(true);
  await openVersions(pid);   // 重新拉一遍：历史里多了一版
}

function closeVersions() {
  const m = $('#vmask');
  if (!m) return;
  m.classList.remove('on');
  m.setAttribute('aria-hidden', 'true');
}

/* ------------------------------------------------------------------ 会话 */
/* 会话是**人**这一侧的一组对话。它不发明语义：切会话 = 换一份 history，
   而那份 history 在磁盘上（workspace/sessions/<pid>/<sid>.jsonl）。服务端在
   stateless 模式下本来就不留历史 —— 所以这里没有第二条真相可以分叉。
   忙时不许切：那一轮的事件会落错地方，而且它不会报错，只会对不上。 */
function wireSessions() {
  const b = $('#sessbtn');
  if (!b) return;
  // 标题来自会话本身（reloadThread 接住的），不是 agents 快照 —— 那份里没有 title。
  const t = S.stitle[S.pid];
  b.title = t ? `当前会话：${t}` : '会话：新建 / 切换 / 改名 / 删除';
  b.onclick = () => openSessions(S.pid);
  const n = $('#snew');
  if (n) n.onclick = () => doNewSession(S.pid);
  const c = $('#sclose');
  if (c) c.onclick = closeSessions;
}

function setSHint(text, cls) {
  const el = $('#smsg');
  if (!el) return;
  el.textContent = text || '';
  el.className = 'hint' + (cls ? ' ' + cls : '');
}

function fmtTime(t) {
  const n = Number(t || 0);
  if (!n) return '—';
  const d = new Date(n * 1000);
  const p = (x) => String(x).padStart(2, '0');
  const hm = `${p(d.getHours())}:${p(d.getMinutes())}`;
  // 今天 / 昨天 / 更早：人不做日期减法 —— 「11-25 13:17」得先算一下才知道是不是今天。
  const day = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const t0 = new Date();
  t0.setHours(0, 0, 0, 0);
  const back = Math.round((t0.getTime() - day) / 86400000);
  if (back === 0) return `今天 ${hm}`;
  if (back === 1) return `昨天 ${hm}`;
  return `${d.getMonth() + 1}-${p(d.getDate())} ${hm}`;
}

async function jpost(url, body) {
  return fetch(url, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body || {}),
  }).then((x) => x.json()).catch((err) => ({ status: 'error', message: String(err) }));
}

/* 切完会话，屏幕上的那一串必须**整份换掉** —— 增量一定会漏。
   截断也不静默：上面还有就明说，否则人以为旧对话丢了。 */
async function reloadThread(pid, sid) {
  const r = await fetch(`/api/p/${pid}/session/${sid}?limit=200`)
    .then((x) => x.json()).catch(() => null);
  if (!r || r.error || !r.messages) return;
  S.sid[pid] = r.sid || sid;
  if (r.title) S.stitle[pid] = r.title;
  const sb = $('#sessbtn');                       // 切完会话，悬停里那句也得跟着换
  if (sb && pid === S.pid) {
    sb.title = S.stitle[pid] ? `当前会话：${S.stitle[pid]}` : sb.title;
  }
  const rows = groupRetracted(r.messages.map((h) => ({
    role: h.role === 'user' ? 'me' : 'it', text: h.text || '', tools: [],
    files: h.files || [],                // 引用，不是字节：界面按引用拼 /img/<name>
    note: h.sys ? true : undefined,      // 接力消息是程序自己发的，不冒充人话
    turn: h.turn || '', retracted: !!h.retracted,
  })));
  if (r.truncated) {
    rows.unshift({ role: 'it', note: true, tools: [],
      text: `这个会话共 ${r.total} 条，这里显示最后 ${r.shown} 条。` });
  }
  S.msgs[pid] = rows;
  S.cur[pid] = null;
  if (pid === S.pid) paintThread();
}

async function openSessions(pid) {
  const m = $('#smask');
  if (!m) return;
  m.classList.add('on');
  m.setAttribute('aria-hidden', 'false');
  $('#stitle').textContent = `${(prog(pid) || {}).title || pid} · 会话`;
  setSHint('读取中…');
  $('#slist').innerHTML = '';
  const r = await fetch(`/api/p/${pid}/sessions`).then((x) => x.json())
    .catch((err) => ({ error: String(err) }));
  if (r.error) { setSHint(r.error, 'bad'); return; }
  const rows = r.sessions || [];
  if (!rows.length) { setSHint('还没有任何会话。'); return; }
  setSHint((r.truncated
    ? `只显示最近 ${rows.length} 个（更早的还有）。`
    : `共 ${rows.length} 个会话。`)
    + '删掉的会先进回收站，需要时能捞回。');
  /* 每一行只回答两个问题：这是哪个会话（标题 + 什么时候、几轮）、我能对它做什么。
     切过去 = **点这一行**（整行都是它）；动作只留「改名」「删除」两个。
     token 数不进这一行：那是账单，不是「这是哪个会话」。 */
  $('#slist').innerHTML = rows.map((s) => `
    <div class="vrow srow${s.active ? ' cur' : ''}" data-sid="${esc(s.sid)}"
         ${s.active ? '' : 'title="切到这个会话"'}>
      <div class="vmain">
        <div class="vno">${esc(s.title || '（未命名）')}</div>
        <div class="vmeta">${esc(fmtTime(s.updated))} · ${Number(s.turns || 0)} 轮</div>
      </div>
      ${s.active ? '<span class="scur">当前</span>' : ''}
      <button type="button" class="sact" data-act="rename" data-sid="${esc(s.sid)}">改名</button>
      <button type="button" class="sact dele" data-act="delete" data-sid="${esc(s.sid)}">删除</button>
    </div>`).join('');
  $('#slist').querySelectorAll('.vrow.srow').forEach((row) => {
    if (row.classList.contains('cur')) return;          // 已经在用的那个：点了也没事可做
    const sid = row.dataset.sid;
    row.onclick = (e) => {
      if (e.target.closest && e.target.closest('button,input')) return;
      // 双击选词不算「点行」：选完就切走，选区当场没了。
      if (!window.getSelection().isCollapsed) return;
      doSwitch(pid, sid);
    };
  });
  $('#slist').querySelectorAll('button[data-act]').forEach((b) => {
    b.onclick = () => {
      const sid = b.dataset.sid;
      if (b.dataset.act === 'delete') return armDelete(b, () => doDrop(pid, sid, b));
      return startRename(pid, sid, b);
    };
  });
}

function closeSessions() {
  const m = $('#smask');
  if (!m) return;
  m.classList.remove('on');
  m.setAttribute('aria-hidden', 'true');
}

async function doSwitch(pid, sid) {
  setSHint('正在切过去…');
  const r = await jpost(`/api/p/${pid}/session/switch`, { sid });
  if (r.status !== 'ok') { setSHint(r.message || '切换失败', 'bad'); return; }
  await reloadThread(pid, sid);
  await openSessions(pid);
  setSHint(r.message || '已切换', 'ok');
}

async function doNewSession(pid) {
  setSHint('正在新建…');
  const r = await jpost(`/api/p/${pid}/session/new`, {});
  if (r.status !== 'ok') { setSHint(r.message || '新建失败', 'bad'); return; }
  await reloadThread(pid, r.sid);
  await openSessions(pid);
  setSHint('新会话已开；之前的对话还在，随时能切回去。', 'ok');
}

/* 删除按两下。一步就删的东西，在「极简」的界面里迟早会被误触 —— 而这里删掉的是
   对话（虽然进回收站，但没人愿意专门去那儿捞）。第一下把按钮变成「确认删除」，
   4 秒没有第二下就自己变回去 —— 不弹窗、不占地方。 */
function armDelete(btn, run) {
  if (btn.dataset.armed === '1') {
    delete btn.dataset.armed;
    clearTimeout(btn._t);
    return run();
  }
  btn.dataset.armed = '1';
  btn.textContent = '确认删除';
  btn.classList.add('confirm');
  btn._t = setTimeout(() => {
    delete btn.dataset.armed;
    btn.textContent = '删除';
    btn.classList.remove('confirm');
  }, 4000);
}

async function doDrop(pid, sid, btn) {
  const row = btn.closest ? btn.closest('.vrow') : null;
  const no = row ? row.querySelector('.vno') : null;
  const title = no ? no.textContent : '';
  btn.disabled = true;
  setSHint('正在删除…');
  const r = await jpost(`/api/p/${pid}/session/delete`, { sid });
  if (r.status !== 'ok') {
    btn.disabled = false;
    setSHint(r.message || '删除失败', 'bad');
    return;
  }
  if (sid === S.sid[pid]) await reloadThread(pid, r.sid);
  await openSessions(pid);
  // 服务端那句还带着落盘文件名（sessions/.trash/…）：那是账，不是给人读的话。
  setSHint(`已删掉${title ? `「${title}」` : ''} —— 回收站里还留着，捞得回来。`, 'ok');
}

/* 行内改名：就地变成输入框。Enter 保存、Esc 放弃、失去焦点也保存。 */
function startRename(pid, sid, btn) {
  const row = btn.closest('.vrow');
  const no = row && row.querySelector('.vno');
  if (!no) return;
  const cur = no.textContent === '（未命名）' ? '' : no.textContent;
  no.innerHTML = `<input class="sren" spellcheck="false">`;
  const inp = no.querySelector('input');
  inp.value = cur;
  inp.focus();
  inp.select();
  let done = false;
  const restore = () => { done = true; no.textContent = cur || '（未命名）'; };
  const save = async () => {
    if (done) return;
    const title = inp.value.trim();
    if (!title || title === cur) return restore();
    done = true;
    const r = await jpost(`/api/p/${pid}/session/rename`, { sid, title });
    if (r.status !== 'ok') { done = false; restore(); setSHint(r.message || '改名失败', 'bad'); return; }
    await openSessions(pid);
    setSHint(r.message || '已改名', 'ok');
  };
  inp.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
    if (e.key === 'Escape') { e.preventDefault(); restore(); }
  };
  inp.onblur = save;
}

/* 对话面板宽度：localStorage 记住，按程序分开记。
   为什么按 pid：一个程序的页面可能要宽（看图表），另一个只要一句提醒 —— 宽度
   和程序一样是「他的东西」，替他统一成一个比例反而添麻烦。 */
const CHATW_KEY = 'ws.chatw';

function chatW(pid) {
  const v = Number(localStorage.getItem(`${CHATW_KEY}.${pid}`) || localStorage.getItem(CHATW_KEY) || 0);
  return v > 0 ? v : 380;
}

/* 夹住宽度：对话不许窄到读不了，程序页也不许被挤没。
   纯函数 —— 拖动、键盘、窗口缩放都走它，所以只需验一次。 */
function clampChatW(w, stageW) {
  const lo = 300;
  const hi = Math.max(lo, (stageW || 0) - 320);
  return Math.round(Math.min(Math.max(w, lo), hi));
}

function wireGutter() {
  const g = $('#gutter');
  if (!g) return;
  const split = g.parentElement;
  const pid = S.pid;
  let cur = null;

  const put = (w, save) => {
    const v = clampChatW(w, split.clientWidth);
    split.style.setProperty('--chatw', v + 'px');
    cur = v;
    if (save) localStorage.setItem(`${CHATW_KEY}.${pid}`, String(v));
    return v;
  };
  put(chatW(pid), false);

  let drag = null;
  g.addEventListener('pointerdown', (e) => {
    drag = { x: e.clientX, w: cur || chatW(pid) };
    try { g.setPointerCapture(e.pointerId); } catch (err) { /* 合成事件没有真实指针 */ }
    g.classList.add('drag');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  g.addEventListener('pointermove', (e) => {
    if (!drag) return;
    put(drag.w - (e.clientX - drag.x), false);    // 往左拖 → 对话更宽
  });
  const end = () => {
    if (!drag) return;
    drag = null;
    g.classList.remove('drag');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    if (cur != null) localStorage.setItem(`${CHATW_KEY}.${pid}`, String(cur));
  };
  g.addEventListener('pointerup', end);
  g.addEventListener('pointercancel', end);
  g.addEventListener('dblclick', () => {
    localStorage.removeItem(`${CHATW_KEY}.${pid}`);
    localStorage.removeItem(CHATW_KEY);
    put(380, false);
  });
  g.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    put((cur || chatW(pid)) + (e.key === 'ArrowLeft' ? 24 : -24), true);
  });
}

const ph = (p) => p.id === 'assistant'
 ? '跟小助理说点什么，比如「给我做个喝水提醒」' : `跟「${p.title}」说点什么`;

function wireComposer() {
  const ta = $('#ta'), form = $('#composer'), btn = $('#sendb');
  if (!ta || !form) return;
  ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 160) + 'px'; };
  wirePictures(ta, form);
  paintPends(S.pid);
  // 回车只**尝试**提交：忙不忙的判据在 submitDraft 里，键盘/按钮/程序化提交
  // 三条路共用同一处判断 —— 两处判断就一定会有一处忘了改。
  ta.onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  };
  form.onsubmit = (e) => { e.preventDefault(); submitDraft(); };
  /* 按钮是 type="button"，不是 submit：忙的时候它已经**不是发送键**了
     （原地变成停止）。留着 type="submit" 的话，按「停止」会先触发一次表单提交 ——
     一次「发送」发生在停止键上，最难查的那类错。 */
  if (btn) btn.onclick = () => {
    const act = TM.btn(phaseOf(S.pid)).action;
    if (act === 'stop') stopTurn(S.pid);
    else if (act === 'send') submitDraft();
  };
  paintComposer(S.pid);
  ta.focus();
}

/* ------------------------------------------------------------ 待发的图
   三条入口（粘贴 / 拖进来 / 选文件）落进**同一个列表**：同一个东西就该有
   同一条路 —— 三条各写一遍，迟早有一条忘了清、或者忘了判体量。 */
const MAX_PICS = 8;         // 与服务端一轮的上限同一个数（多出来的会被整批拒）

function pendpics(pid) { return S.pend[pid] || (S.pend[pid] = []); }

function addPics(pid, files) {
  if (pid !== S.pid) return;                 // 图只属于看得见的那个输入框
  const list = pendpics(pid);
  let room = MAX_PICS - list.length;
  for (const f of files) {
    if (!f || !String(f.type || '').startsWith('image/')) continue;
    if (room <= 0) {
      push(pid, { role: 'it', note: true, tools: [],
                  text: `一次最多 ${MAX_PICS} 张图 —— 多出来的这几张没有加进来` });
      break;
    }
    room -= 1;
    list.push({ blob: f, url: URL.createObjectURL(f), name: f.name || '图.png' });
  }
  paintPends(pid);
}

function paintPends(pid) {
  const box = $('#pends');
  if (!box || pid !== S.pid) return;
  const list = pendpics(pid);
  box.style.display = list.length ? 'flex' : 'none';
  box.innerHTML = list.map((p, i) => `<div class="pk"><img src="${esc(p.url)}"
      alt="${esc(p.name)}" title="${esc(p.name)}"><button type="button" data-pk="${i}"
      aria-label="移除这张" title="不发这张">×</button></div>`).join('');
  paintComposer(pid);                        // 只有图也能发：按钮的可按性跟着它动
}

function dropPic(pid, i) {
  const list = pendpics(pid);
  const gone = list.splice(i, 1)[0];
  if (gone && gone.url) URL.revokeObjectURL(gone.url);
  paintPends(pid);
}

function clearPics(pid) {
  for (const p of pendpics(pid)) if (p.url) URL.revokeObjectURL(p.url);
  S.pend[pid] = [];
  paintPends(pid);
}

/* 一张图 → 一次 POST 里的那一份。异步是因为 FileReader 异步；
   失败也**不 reject** —— 返回一份空 data，由服务端那道预检给出人话。 */
function encodePic(p) {
  return new Promise((resolve) => {
    const fr = new FileReader();
    fr.onload = () => {
      const s = String(fr.result || '');
      resolve({ name: p.name, mime: String(p.blob.type || ''), data: s.split(',')[1] || '' });
    };
    fr.onerror = () => resolve({ name: p.name, mime: '', data: '' });
    fr.readAsDataURL(p.blob);
  });
}

function wirePictures(ta, form) {
  const pick = $('#pickb'), inp = $('#pickf');
  if (pick && inp) {
    pick.onclick = () => inp.click();
    inp.onchange = () => { addPics(S.pid, [...inp.files]); inp.value = ''; };
  }
  /* 粘贴：**只有真的带着图才抢**。纯文本粘贴必须照旧交给浏览器 ——
     把它也拦下来，那种「粘贴没反应」的错最难查。 */
  ta.addEventListener('paste', (e) => {
    const files = [...((e.clipboardData && e.clipboardData.files) || [])];
    if (!files.length) return;
    e.preventDefault();
    addPics(S.pid, files);
  });
  /* 拖进来的落点反馈：拖到一半松手是**什么都不发生**的，所以必须看得出「这里收」。
     用计数器而不是布尔：dragenter/leave 会在子元素之间成对地反复触发，
     一个布尔值会让高亮在鼠标从 textarea 滑到按钮上时闪一下。 */
  const hasFiles = (e) => [...(((e.dataTransfer || {}).types) || [])].includes('Files');
  let depth = 0;
  const off = () => { depth = 0; form.classList.remove('drag'); };
  form.ondragenter = (e) => {
    if (!hasFiles(e)) return;
    depth += 1;
    form.classList.add('drag');
  };
  form.ondragover = (e) => { e.preventDefault(); };   // 不拦这一下就没有 drop
  form.ondragleave = () => { depth -= 1; if (depth <= 0) off(); };
  form.ondrop = (e) => {
    e.preventDefault();
    off();                                            // 松手就撤，无论收不收
    addPics(S.pid, [...((e.dataTransfer || {}).files || [])]);
  };
  const box = $('#pends');
  if (box) box.onclick = (e) => {
    const b = e.target.closest ? e.target.closest('button[data-pk]') : null;
    if (b) return dropPic(S.pid, Number(b.dataset.pk));
    const im = e.target.closest ? e.target.closest('img') : null;   // 没发出去也能看大图
    if (im) openPhoto(im.src);
  };
}

/* ------------------------------------------------------- 对话的忙碌闸门
   相位由 turn.js 那个纯函数决定；这里只做两件事：把相位翻译成界面、跑副作用。
   界面里不再有第二处「忙不忙」的判断 —— 那正是并发与丢字的入口。 */
const TM = (typeof TURN === 'object' && TURN) ? TURN : {
  /* turn.js 没加载时的退化版：只有两档（空闲 / 在跑），**没有停止**。
     刻意**不复刻** turn.js 的转移表 —— 复刻出来的那份一定与它走散（少 stopping、
     少 cancelFailed，按钮永远不给「停止」），而「同一句操作在两个加载结果下行为
     不同」比「简单但一致」危险得多。这里只保证一件事：输入框不许变成一块死板。 */
  IDLE: 'idle', SENDING: 'sending', RUNNING: 'running', STOPPING: 'stopping',
  next: (p, ev) => {
    const t = (ev && ev.type) || String(ev || '');
    if (!t) return p || 'idle';
    if (t === 'terminal' || t === 'linkDown') return 'idle';
    /* 退化版**只**丢掉 stopping 这一档。还有两处守卫必须留下 —— 它们防的不是
       「停止」，而是两轮并发：
         · reject 只认 sending：迟到的 reject 不许把已经在跑的一轮解锁；
         · 快照说「不忙」不许解锁 sending：我们那次 POST 可能还没到服务端。
       少了 sending 这一档，这两条就都保不住。 */
    if (t === 'submit') return (p || 'idle') === 'idle' ? 'sending' : (p || 'idle');
    if (t === 'sent' || t === 'started') return (p || 'idle') === 'idle' ? 'idle' : 'running';
    if (t === 'reject') return (p || 'idle') === 'sending' ? 'idle' : (p || 'idle');
    if (t === 'snapshot') return (ev && ev.busy) ? 'running'
      : ((p || 'idle') === 'sending' ? 'sending' : 'idle');
    return p || 'idle';
  },
  canSubmit: (p) => (p || 'idle') === 'idle',
  canStop: () => false,                    // 没有转移表就别假装有「停止」
  isBusy: (p) => (p || 'idle') !== 'idle',
  btn: (p) => ((p || 'idle') === 'idle'
    ? { label: '发送', cls: 'p', disabled: false, action: 'send' }
    : { label: '运行中…', cls: 'p busy', disabled: true, action: null }),
};

const phaseOf = (pid) => S.phase[pid] || TM.IDLE;

/* 换相位只有这一个入口：状态、闸门、按钮同时更新；
   「进入 stopping 就上闹钟、离开就撤」也在这里，所以不会漏撤。 */
function setPhase(pid, ev) {
  const before = phaseOf(pid);
  const wasBusy = !!S.busy[pid];
  const nx = TM.next(before, ev);
  S.phase[pid] = nx;
  S.busy[pid] = TM.isBusy(nx);
  if (nx !== before) {
    if (nx === 'stopping') armStopWatch(pid); else disarmStopWatch(pid);
  }
  if (pid === S.pid) {
    paintComposer(pid);
    /* 闸门一变，thread 末尾那个「…」也该跟着来去：按下发送到 turn.started
       之间可能有 20 秒（Link.send 会等连接），那段时间输入框已清空、按钮写着
       「发送中…」，对话里却只有一句孤零零的问话 —— 看不出这一轮其实起来了。 */
    if (!!S.busy[pid] !== wasBusy) paintThread();
  }
  return nx;
}

function paintComposer(pid) {
  if (pid !== S.pid) return;
  const btn = $('#sendb');
  if (!btn) return;
  const spec = TM.btn(phaseOf(pid));
  if (btn.textContent !== spec.label) btn.textContent = spec.label;
  btn.className = spec.cls;
  btn.disabled = !!spec.disabled;
  btn.setAttribute('aria-label', spec.label);
  /* 忙碌时输入框**不禁用**：人常想「它跑着，我先把下一句写好」。
     字是人的东西，界面不该收走 —— 收走的是「现在能送出去」这件事。 */
}

/* 发一句。三条不许破的规矩：
   1) 忙的时候**不提交、不清空、不报错** —— 按下去没有反应，字还在原处；
   2) 被拒就把原文放回输入框，且**不**在对话里留下「我说过的话」；
   3) 按下就乐观置忙：按下到 turn.started 之间有一次往返，那段时间若不算忙，
      连按两次回车就是两轮并发（第二条必被拒、而字已经先被清掉了）。
   为什么「清空」在按下时就做（而不是等 sent）：Link.send 在连接还没建好时
   会**等最多 20 秒**，那 20 秒里旧文字留在框里，人接着打字就拼在一起。
   「不丢」由回滚保证 —— 「清空」和「不丢」本来就是两件事。 */
async function submitDraft() {
  const pid = S.pid, ta = $('#ta');
  if (!ta) return;
  if (!TM.canSubmit(phaseOf(pid))) { ta.focus(); return; }
  const text = ta.value.trim();
  const pends = pendpics(pid);
  // 只有图、没有字是**一句话**（「这张怎么样」的省略式）。两样都没有才是空。
  if (!text && !pends.length) return;
  // 先摆上去：消息顺序必须对。turn.started / delta 可能比 POST 的响应**先到**，
  // 那时才 push 的话，人说的话会排在自己的回答后面。
  const shots = pends.map((p) => ({ name: p.name, url: p.url }));
  const mine = push(pid, { role: 'me', text, tools: [], files: shots });
  ta.value = ''; ta.style.height = 'auto';
  setPhase(pid, 'submit');
  S.cur[pid] = null;
  const images = await Promise.all(pends.map(encodePic));
  const r = await fetch(`/api/p/${pid}/chat`, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ text, images }),
  }).then((x) => x.json()).catch((e) => ({ status: String(e) }));
  const st = String((r && r.status) || '');
  if (st === 'sent') {                     // 受理了：那句成为真的「我说过的话」
    clearPics(pid);                        // 图已经随这一轮出去了，预览条清空
    setPhase(pid, 'sent');
    return;
  }
  // 没受理。但「没受理」有两种，撤不撤那句话完全相反 ——
  // `reject` 只在 sending 这一档生效（turn.js）：相位已经推到 running 时
  // （turn.started 顺着 SSE 先到、或快照说 busy），服务端其实**收下了**。
  // 这时把话从对话里抽走、把文字塞回输入框，屏幕上就成了「有回答、没有提问」，
  // 而回填的草稿一送又会被「上一轮还没结束」拒掉 —— 两头都不对。
  const nx = setPhase(pid, 'reject');
  if (nx !== TM.IDLE) {
    push(pid, { role: 'it', note: true, tools: [],
                text: `回执没拿到（${st || '未知原因'}）—— 但这一轮看起来已经在跑，就不把那句撤回来了` });
    return;
  }
  // 先回填、再决定留不留：顺序反过来就是「话撤走了、字又放不回去」。
  // 回填失败只有一种原因 —— 人已经切到别的程序，那个输入框不在了。那时
  // **不能**把那句话撤走：撤走就是丢人的字。留着它，注明没送出去。
  // 带图的这一轮被拒时，**图还留在预览条上**（上面那些 dropPic/clearPics
  // 只在受理后才动它）：人改一个字再发，图不必重新挑一遍。
  const kept = shots.length ? `（${shots.length} 张图还在输入框上）` : '';
  if (restoreDraft(pid, text)) {
    dropMsg(pid, mine);
    push(pid, { role: 'it', note: true, tools: [],
                text: `没能送出去：${st || '未知原因'} —— 这句话${kept || '已经放回输入框'}` });
  } else {
    mine.failed = true;
    push(pid, { role: 'it', note: true, tools: [],
                text: `没能送出去：${st || '未知原因'} —— 已经切到别的程序，这句话留在这里` });
    if (pid === S.pid) paintThread();
  }
}

function dropMsg(pid, m) {
  const list = msgs(pid);
  const i = list.indexOf(m);
  if (i < 0) return;
  list.splice(i, 1);
  /* 删掉一条，后面的全部前移一位 —— 索引不跟着挪，`S.cur[pid]` 就会指向
     **别人的**那条消息。被拒时正是这个形状：人的话在 i、空气泡在 i+1，
     删掉 i 之后 `i+1` 成了「那条注脚」—— 于是流式文本灌进注脚里，
     终态去改一条与它无关的消息。 */
  const cur = S.cur[pid];
  if (cur != null) S.cur[pid] = (cur === i) ? null : (cur > i ? cur - 1 : cur);
  if (pid === S.pid) paintThread();
}

/* 把没送出去的那句放回输入框。人中途已经写下下一句时**不覆盖**：
   旧的放上面、光标停在接缝 —— 两句都在，都能改。 */
function restoreDraft(pid, text) {
  // 返回「到底放回去没有」：调用方要靠它决定那句话撤不撤 ——
  // 无条件宣称「已经放回输入框」会同时变成一句假话和一次静默丢字。
  if (pid !== S.pid) return false;        // 已经切到别的程序：那个输入框不在了
  const ta = $('#ta');
  if (!ta) return false;
  const now = ta.value;
  if (!now.trim()) ta.value = text;
  else if (now.trim() !== text) ta.value = text + '\n' + now;
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
  ta.selectionStart = ta.selectionEnd = text.length;
  ta.focus();
  return true;
}

/* 停止 = **请求**，不是完成。aaas 的 cancel 只表示「受理」（caller.cancel 的原话：
   result 只表示受理，终态看事件）。所以三档：停止 → 正在停止… → 终态。
   不这么做，人点一下没反应就会连点，而那时它根本还没停。 */
async function stopTurn(pid) {
  if (!TM.canStop(phaseOf(pid))) return;
  setPhase(pid, 'stop');
  const r = await fetch(`/api/p/${pid}/cancel`, { method: 'POST' })
    .then((x) => x.json()).catch((e) => ({ status: 'error', message: String(e) }));
  // 判据是服务端给的**机器码**，不是那句中文：靠 startswith 认结论，
  // link.py 里改一个字、或新加一句同前缀的失败信息，界面就静默走错分支 ——
  // 而这条路上走错的意思是「它还在跑，界面以为停住了」。
  //   cancelling = 受理了，等终态；idle = 本来就没在跑（等于停住了）；error = 没送出去。
  const code = String((r && r.status) || '');
  const why = String((r && r.message) || '');
  // 闹钟已经在 setPhase(pid,'stop') 里上好，不会无限等。
  if (code === 'cancelling') return;        // 受理了：等终态
  /* 往下都是「没受理」，而这条回执可能**迟到**：等它回来这段时间里，这一轮可能
     已经正常收尾（turn.completed → idle），人还可能顺手发了下一句（→ sending）。
     那时一条旧的取消回执**不许再动闸门** —— 尤其不许把 sending 解锁，那是连发与
     丢字的入口。所以往下先看相位，只看自己该管的那个相位。 */
  if (phaseOf(pid) !== 'stopping') return;
  /* idle = 服务端说「本来就没在跑」。这两种情形**不会再有终态事件到来**
     （没有可取消的轮次 / 没有 link），所以「等终态」是等不到的：按钮会卡在
     「正在停止…」整 15 秒，然后闹钟再补一句「服务可能仍在执行」——
     而那时它根本没在跑，一句凭空捏造的假话。这一轮既然已经结束，就按终态收掉
     （顺带撤掉闹钟）。 */
  if (code === 'idle') { setPhase(pid, 'terminal'); return; }
  setPhase(pid, 'cancelFailed');
  push(pid, { role: 'it', note: true, tools: [],
              text: `停止请求没送出去：${why || code || '未知原因'} —— 它可能还在跑` });
}

/* 请求停止后等终态的兜底。模型正调长工具时，服务端可能几秒才回终态；
   也可能**一直不回** —— 那时界面会永久「正在停止…」，除了重启没有出路。
   15 秒后强制解锁，并把「没能确认」说出来：不假装停了。 */
const STOP_WAIT_MS = 15000;
const stopTimers = {};
function armStopWatch(pid) {
  disarmStopWatch(pid);
  stopTimers[pid] = setTimeout(() => {
    delete stopTimers[pid];
    if (phaseOf(pid) !== 'stopping') return;
    setPhase(pid, 'stopTimeout');
    push(pid, { role: 'it', note: true, tools: [],
                text: `等了 ${STOP_WAIT_MS / 1000} 秒还没确认停止：服务可能仍在执行，界面已解锁。` });
  }, STOP_WAIT_MS);
}
function disarmStopWatch(pid) {
  if (stopTimers[pid]) { clearTimeout(stopTimers[pid]); delete stopTimers[pid]; }
}

/* 停止 = 撤回：这一轮**已经不在模型看到的历史里**了（服务端在终态时追加了一条
   retract 记录，见 sessions.Store.retract）。界面上不画成「消失」—— 人还得知道
   发生过什么 —— 而是塌成一枚虚线记号：

     · 原话留着（截一行）：不知道刚才问了什么，就没法重发；
     · 半句回答与工具卡收在「展开」后面，正文加删除线、卡标「已中断」；
     · 「重新发送」把原话填回输入框 —— 那就是一次普通发送，不需要新接口。

   为什么不删掉：这条 thread 是「发生过什么」的正文，删掉等于撒谎。
   为什么不留在正文里：**正文归人，记号归历史** —— 一段不算数的话不该继续
   占着正文的位置，也不该让模型在下一轮里把它当成自己的回答。 */
function collapseTurn(pid, turn, opt) {
  const list = msgs(pid);
  const hit = list.filter((m) => m.turn && m.turn === turn);
  const me = hit.find((m) => m.role === 'me');
  const it = hit.find((m) => m.role === 'it');
  /* 被停掉的那一轮**永远不会再来一条 call.result**（这一轮已经没了）。
     卡还挂在「运行中」，组头就会一边报「进行中」、紧挨着的记号却写着「已停止」——
     而「有长工具在飞的时候按停止」恰恰是最常见的用法。
     就地收尾：这些调用既不是「完成」也不是「失败」，是**被打断**。 */
  const tools = (it && it.tools) || [];
  for (const t of tools) if (t.status === '运行中') t.status = '已中断';
  const at = hit.length ? list.indexOf(hit[0]) : list.length;
  for (let i = list.length - 1; i >= 0; i -= 1) if (hit.includes(list[i])) list.splice(i, 1);
  const marker = {
    role: 'it', retract: true, turn: turn || '',
    text: (me && me.text) || (opt && opt.text) || '',
    files: (me && me.files) || [],
    tools: tools, half: (it && it.text) || '',
  };
  list.splice(Math.max(0, Math.min(at, list.length)), 0, marker);
  return marker;
}

/* 盘上那条 retract 记录 → 界面上的一枚记号。**刷新、换窗口、重连之后记号还在，
   而且不会复活**：判据来自文件，不是来自「这个窗口上点过停止」。 */
function groupRetracted(rows) {
  const gone = new Set();
  for (const h of rows) if (h.retracted && h.turn) gone.add(h.turn);
  if (!gone.size) return rows;
  const g = new Map();
  for (const h of rows) {
    if (!h.turn || !gone.has(h.turn)) continue;
    const one = g.get(h.turn) || { text: '', files: [], half: '' };
    if (h.role === 'me') { one.text = h.text || one.text; one.files = h.files || one.files; }
    else if (h.text) one.half = one.half ? `${one.half}\n\n${h.text}` : h.text;
    g.set(h.turn, one);
  }
  const out = [];
  for (const h of rows) {
    if (h.turn && gone.has(h.turn)) {
      const one = g.get(h.turn);
      if (one && !one.done) {
        one.done = true;
        out.push({ role: 'it', retract: true, turn: h.turn, text: one.text,
                   files: one.files, tools: [], half: one.half });
      }
      continue;
    }
    out.push(h);
  }
  return out;
}

/* 「重新发送」：把原话填回输入框 —— 不改任何状态、不发任何请求。
   人自己按发送，才是一句话；替人发出去就不叫「重新」了。 */
function resend(text) {
  const ta = $('#ta');
  if (!ta) return;
  ta.value = String(text || '');
  ta.focus();
  // 长高与 ta.oninput 里那两行同一份。刻意**不派发 input 事件**：那个 DOM 事件名
  // 里含有「内核话术」那条门要挡的词，写法上绕开它，门就不必为一条注释放宽。
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
}

/* 一字未产出的气泡：结束时不留一个空壳。 */
function dropEmpty(pid, m) {
  if (m && !m.text && !(m.tools || []).length) dropMsg(pid, m);
}

function paintThread() {
  const el = $('#thread');
  if (!el) return;
  /* 选中复制（二）：**人在选的时候不许换 DOM**。
     这条 thread 每收一个 delta 就整段 innerHTML 重画一次；重画会把已经拉好的
     选区当场抹掉 —— 于是「流式输出时选不中」，而这看起来和「不能复制」是同一个症状。
     代价：这一帧不画。不丢数据 —— msgs 本来就都在 S 里，欠下的帧由 selectionchange
     在选区消失时补上（见下面 pasteGuard / selectionchange）。 */
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed && sel.anchorNode && el.contains(sel.anchorNode)) {
    threadDirty = true;
    return;
  }
  const list = msgs(S.pid);
  const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 24;
  let html = list.map((m, i) => { m._i = i; return msgHtml(m); }).join('');
  const last = list[list.length - 1];
  if (S.busy[S.pid] && (!last || last.role === 'me' || (!last.text && !(last.tools || []).length))) {
    html += '<div class="msg"><div class="body dim">…</div></div>';
  }
  el.innerHTML = html;
  // 重绘每一条事件都发生：贴着底才跟随，否则人往上翻的位置会被拽回去。
  if (atBottom) el.scrollTop = el.scrollHeight;
}

/* 这一组工具现在该展开吗？——只有一个判据，三处共用。
   用户没表过态时：正在跑就展开（看得见它在干什么），跑完就收起（回到安静）。 */
function toolsOpen(m) {
  if (m.gTouched) return !!m.gOpen;
  const list = msgs(S.pid);
  return !!S.busy[S.pid] && m === list[list.length - 1];
}

/* 智能体说的话 → Markdown（md.js）；人说的话 → 原文。
 * 为什么不渲染人说的话：那是人自己的原话，打一句 `*这个*` 不该变成斜体。
 * 为什么 note 也不渲染：那是**界面自己**的一句提示（「开发者模式已打开」这类），
 * 不是模型说的话，出现位置也不该随 md 语法变形。
 *
 * 缓存按「文本没变就复用」：每收一个 delta 都会重绘整条 thread，
 * 不缓存的话长对话每来一个字就要把整屏重解析一遍。 */
function bodyHtml(m) {
  if (typeof mdToHtml !== 'function') return esc(m.text);   // md.js 没加载 → 退回纯文本，不白屏
  if (m._mdFor === m.text && m._mdHtml !== undefined) return m._mdHtml;
  let html;
  try {
    html = mdToHtml(m.text);
  } catch (err) {
    // 渲染器是重正则 + 递归解析：一条消息把它打挂，不该把整条 thread 一起带走。
    // 与这个文件既有的态度一致 —— 一条坏事件不掀桌，一条坏消息也一样。
    html = esc(m.text);
  }
  m._mdFor = m.text;
  m._mdHtml = html;
  return html;
}

function msgHtml(m) {
  if (m.retract) return retractHtml(m);
  if (m.role === 'me') {
    // failed = 没送出去、又没能放回输入框（人切了程序）。它不能被画成
    // 「我说过的一句话」，否则下一次看历史会以为它发出去了。
    const body = m.text ? `<div class="body">${esc(m.text)}</div>` : '';
    return `<div class="msg me${m.failed ? ' failed' : ''}">${body}${shotsHtml(S.pid, m)}</div>`;
  }
  // 降级时**不能**挂 md 类：.md 是 white-space:normal，会把兜底纯文本的换行折没
  const cls = m.note ? ' dim' : (typeof mdToHtml === 'function' ? ' md' : '');
  const body = m.text
    ? `<div class="body${cls}">${m.note ? esc(m.text) : bodyHtml(m)}</div>` : '';
  return `<div class="msg">${body}${toolsHtml(m)}</div>`;
}

/* 撤回的记号。它是**一条消息**（占住那一轮原来的位置），不是一个浮在旁边的提示：
   位置本身就是信息 ——「这里本来有一轮，它不算数」。 */
function retractHtml(m) {
  m.gTouched = true; m.gOpen = !!m.open;          // 工具组跟着记号一起开合
  const q = m.text ? `<div class="rq">「${esc(m.text)}」</div>` : '';
  const half = m.half
    ? `<div class="body md">${typeof mdToHtml === 'function' ? mdToHtml(m.half) : esc(m.half)}</div>`
    : '';
  const body = m.open ? `<div class="rb">${half}${toolsHtml(m)}</div>` : '';
  return `<div class="msg"><div class="retract" data-turn="${esc(m.turn || '')}">
    <div class="rh"><span class="ri">↺</span><span>已停止 · 这一轮不计入上下文</span>
      <span class="sp"></span>
      <button type="button" class="rx">${m.open ? '收起' : '展开'}</button>
      <button type="button" class="ry">重新发送</button></div>${q}${body}</div></div>`;
}

/* 一句话带的图。两个来源、一种画法：
   刚发出去的那条手上是本地 object URL；从盘上读回来的那条只有引用，
   于是拼 /img/<name> —— 两处指向同一张图，界面上没有第二种样子。 */
function shotsHtml(pid, m) {
  const list = m.files || [];
  if (!list.length) return '';
  const sid = S.sid[pid];
  const out = list.map((f) => {
    const src = f.url || (sid ? `/api/p/${pid}/session/${sid}/img/${f.name}` : '');
    if (!src) return '';
    const label = f.title || f.name || '图';
    return `<img src="${esc(src)}" alt="${esc(label)}" title="${esc(label)}" loading="lazy">`;
  }).join('');
  return out ? `<div class="shots">${out}</div>` : '';
}

/* 看大图：一整屏的暗底，点任意处或 Esc 关掉。它不改任何状态、不发任何请求 ——
   只是一次「看清楚」。缩略图负责认出是哪张，它负责看清。 */
function openPhoto(src) {
  const lb = $('#lb');
  if (!lb || !src) return;
  lb.querySelector('img').src = src;
  lb.classList.add('on');
  lb.setAttribute('aria-hidden', 'false');
}

function closePhoto() {
  const lb = $('#lb');
  if (!lb || !lb.classList.contains('on')) return;
  lb.classList.remove('on');
  lb.setAttribute('aria-hidden', 'true');
  lb.querySelector('img').src = '';     // 别把上一张的 src 留在 DOM 里
}

function toolsHtml(m) {
  const list = m.tools || [];
  if (!list.length) return '';
  const open = toolsOpen(m);
  const run = list.some((t) => t.status === '运行中');
  /* 被打断的那一张不能算「完成」：组头写「完成」、卡上写「已中断」、尾巴写
     「已停止」—— 三句话互相打架。它单独占一档。 */
  const cut = list.some((t) => t.status === '已中断');
  const lastOne = list[list.length - 1];
  // 收起时也要有一句人话：跑着就报「正在做什么」，跑完就报「做了几次」。
  const sum = run ? esc(lastOne.label) : `${list.length} 次工具调用`;
  let head = '完成', headCls = '';
  if (run) { head = '进行中'; headCls = ' run'; }
  else if (cut) { head = '有中断'; headCls = ' bad'; }
  const rows = list.map((t, i) => {
    const bad = t.status && t.status !== '运行中' && t.status !== '完成' && t.status !== 'ok';
    const cls = t.status === '运行中' ? ' run' : (bad ? ' bad' : '');
    return `<div class="tool${t.open ? ' open' : ''}" data-ti="${i}">
      <button class="th" type="button"><span class="t">${esc(t.label)}</span>
        <span class="st${cls}">${esc(t.status || '')}</span></button>
      ${t.text ? `<div class="r">${esc(t.text)}</div>` : ''}</div>`;
  }).join('');
  return `<div class="tgroup${open ? ' open' : ''}" data-mi="${m._i}">
    <button class="tgh" type="button"><span class="chev">▶</span>
      <span class="sum">${sum}</span>
      <span class="st${headCls}">${head}</span></button>
    <div class="tlist">${rows}</div></div>`;
}

/* 工具区的点击只有两个落点（整组 / 单项）。整段 thread 每次重绘都换掉，
   所以用委托 —— 逐个绑会在重绘后全部失效。 */
function onThreadClick(e) {
  // 缩略图先走：它不是按钮，但在对话区里点一张图就该放大 —— 不管它挂在哪条消息上。
  const im = e.target.closest ? e.target.closest('.shots img') : null;
  if (im) { openPhoto(im.src); return; }
  // 撤回记号上的两个动作：展开/收起（看那一轮到底说了什么）、重新发送。
  const rb = e.target.closest ? e.target.closest('.rx,.ry') : null;
  if (rb) {
    const box = rb.closest('.retract');
    const turn = box ? (box.dataset.turn || '') : '';
    const m = msgs(S.pid).find((x) => x.retract && (x.turn || '') === turn);
    if (m && rb.classList.contains('rx')) { m.open = !m.open; paintThread(); }
    else if (m) resend(m.text);
    return;
  }
  const btn = e.target.closest ? e.target.closest('.tgh,.th') : null;
  if (!btn) return;
  const grp = btn.closest('.tgroup');
  if (!grp) return;
  const m = msgs(S.pid)[Number(grp.dataset.mi)];
  if (!m) return;
  if (btn.classList.contains('tgh')) {
    m.gTouched = true;                    // 表态过就不再替人自动开合
    m.gOpen = !toolsOpen(m);
  } else {
    const t = (m.tools || [])[Number(btn.closest('.tool').dataset.ti)];
    if (t) t.open = !t.open;
  }
  paintThread();
}

/* 开关拨动 = 这一个程序的助手借来/还回小助理的手。
   不重画舞台 —— 页面没变，变了的是右边这个助手能做什么。 */
async function toggleDev(pid, on) {
  const r = await fetch(`/api/p/${pid}/dev`, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ on }),
  }).then((x) => x.json()).catch(() => null);
  if (!r || r.status !== 'ok') {
    const box = $('#devsw'); if (box) box.checked = !on;
    push(pid, { role: 'it', note: true, tools: [], text: `没能切换：${(r && r.message) || '未知原因'}` });
    return;
  }
  const p = prog(pid); if (p) p.dev = r.dev;
  paintDev(pid, r.dev);
  push(pid, { role: 'it', note: true, tools: [], text: r.dev
    ? '🔧 开发者模式已打开 —— 它现在能读写工作区、跑命令，也能改自己的代码了。'
    : '开发者模式已关闭 —— 它回到只能动自己这个程序的状态。' });
}

function paintDev(pid, on) {
  const box = $('#devsw');
  if (!box || pid !== S.pid) return;
  box.checked = !!on;
  const lab = box.closest('.dev');
  if (lab) lab.classList.toggle('on', !!on);
}

async function toggleNative(pid, running) {
  await fetch(`/api/p/${pid}/${running ? 'close' : 'open'}`, { method: 'POST' })
    .then((r) => r.json()).catch(() => null);
  await loadState();
  paintStage(true);
}

/* ------------------------------------------------------------------ 事件 */
/* aaas 的 error 转成一句话：它可能是 wire 字典（{code, message}），也可能直接是串。
   `text: ${d.error}` 那种写法在字典上会渲染成 [object Object] —— 等于没给原因。 */
function errText(e) {
  if (!e) return '未知原因';
  if (typeof e === 'string') return e;
  return e.message || e.code || JSON.stringify(e);
}

function on(ev) {
  const pid = ev.pid || 'assistant';
  const d = ev.data || {};
  S.tick[pid] = (S.tick[pid] || 0) + 1;
  switch (ev.type) {
    case 'turn.started': {
      /* 把轮号记到这一轮的两条气泡上。撤回时**按 id 找，不靠「最后一个」**：
         一个窗口可能晚一步收到事件，也可能漏掉一条 —— 「最后一个」在那种时候
         指向别人的那一轮，撤回就会撤错东西。 */
      const list = msgs(pid);
      for (let i = list.length - 1; i >= 0; i -= 1) {
        if (list[i].role === 'me' && !list[i].turn) { list[i].turn = d.turnId || ''; break; }
      }
      S.cur[pid] = null;
      curIt(pid).turn = d.turnId || '';
      setPhase(pid, 'started');
      break;
    }
    case 'message.delta':
      curIt(pid).text += (d.text || ''); break;
    case 'call.ready': {
      const m = curIt(pid);
      // 带上 callId：事件里一直有，是前端把它丢了 —— 于是「结果」只能认成
      // 「最后一条」，交错的调用会把结果贴到别人的卡上
      m.tools.push({ label: labelOf(pid, d.name), status: '运行中', text: '',
                     callId: d.callId || '' });
      break;
    }
    case 'call.result': {
      // 这一轮已经收尾（S.cur 被清空）：迟到的结果不再去 curIt —— 那会凭空多出
      // 一个「只有结果、没有问题」的空气泡。
      if (S.cur[pid] == null) break;
      const m = curIt(pid);
      let t = d.callId ? m.tools.find((x) => x.callId === d.callId) : null;
      if (!t) t = m.tools.slice().reverse().find((x) => x.status === '运行中');
      if (t) { t.status = d.status || '完成'; t.text = String(d.text || '').slice(0, 600); }
      break;
    }
    case 'turn.completed': {
      // 不 curIt(...)：那会在没产出时**新建**一个空气泡，而我们正要判断「该不该留」
      let m = (S.cur[pid] != null) ? msgs(pid)[S.cur[pid]] : null;
      /* 这个页面可能**中途才在场**（刚打开窗口 / SSE 重连过）：它没见过
         turn.started，也没收到过任何一条 delta，`S.cur[pid]` 是 null。
         那一轮的唯一产出就是终态事件里的这份 d.text —— 不接住，屏幕上就是
         「跑完了一轮，什么都不显示」，看起来像答案被吞了。
         （被停止的那一轮同理：它要塌成记号，而记号上的「原话」得先有一条气泡。）
         判据用 `d.retracted`（服务端给的），不在这里自己再判一次。 */
      if (!m && d.text) m = push(pid, { role: 'it', text: d.text, tools: [] });
      else if (m && !m.text && d.text) m.text = d.text;
      const st = String(d.status || '');
      /* 终态不止 completed / cancelled：aaas 的 final.status 原样转了过来，失败
         也会走这条（另一条路是 turn.failed）。只认 'cancelled' 等于把「失败」当
         「正常完成」—— 气泡留着、而 d.error 里那句原因一个字都不显示。 */
      const stopped = st === 'cancelled';
      const failed = !!st && st !== 'completed' && st !== 'cancelled';
      /* 这一轮到此为止：`S.cur[pid]` 必须清掉。它从来不在正常终态时归零，所以
         重连之后新一轮的 delta 会顺着旧索引灌进**上一轮**那条气泡（而这里 m
         非空，终态里那份 d.text 又被跳过）—— 答案于是错位、或者整个丢掉。 */
      S.cur[pid] = null;
      setPhase(pid, 'terminal');          // 闹钟也在这里撤掉
      if (stopped && d.retracted) {
        /* 撤回：这一轮**已经不属于上下文**了 —— 连问句带回答塌成一枚记号。
           判据来自服务端（`turn.completed.retracted`），界面不自己再判一次：
           界面没有「我请求过停止的那几轮」，而判错的方向恰好是「把真答案撤掉」。 */
        collapseTurn(pid, d.turnId || (m && m.turn) || '', { text: d.text });
      } else if (stopped) {
        /* 停是停了，但**不是我们请求的那一轮**（服务端超时 / 上游关闭）。
           答案是真的，留着；只把在飞的工具卡标成「已中断」（它们不会再有结果）。
           不说「已撤回」：那句话是假的。 */
        if (m) for (const t of (m.tools || [])) if (t.status === '运行中') t.status = '已中断';
        dropEmpty(pid, m);
        push(pid, { role: 'it', note: true, tools: [],
                    text: '已停止 · 这一轮不是你请求的停止，答案留在上下文里' });
      } else {
        dropEmpty(pid, m);
        if (failed) {
          push(pid, { role: 'it', note: true, tools: [],
                      text: `这一轮没能完成（${st}）：${errText(d.error)}` });
        }
      }
      break;
    }
    case 'turn.failed':
      setPhase(pid, 'terminal');
      dropEmpty(pid, (S.cur[pid] != null) ? msgs(pid)[S.cur[pid]] : null);
      S.cur[pid] = null;                  // 这一轮结束了：下一轮的 delta 不许落进旧气泡
      push(pid, { role: 'it', text: `出错了：${errText(d.error)}`, tools: [] });
      break;
    case 'turn.cancel_ack':
      break;                              // 受理回执：界面已经在「正在停止…」了
    case 'turn.cancel_failed':
      // 取消没被受理（连接断了 / 服务端不认 aaas/cancelTurn）：它**还在跑**，
      // 如实退回 running，别把「没停成」画成「停了」。
      // 但这条是**另一次往返**的回执，迟到是常态：完全可能在 turn.completed
      // 之后才到。那时相位已回 idle、`cancelFailed` 根本不会转移 —— 可这句话
      // 照样会被 push，屏幕上就成了「给完整个回答，再说它可能还在跑」。
      // 状态机已经拒绝了这次转移，界面就该跟着拒绝这句话。
      if (phaseOf(pid) !== 'stopping') break;
      setPhase(pid, 'cancelFailed');
      push(pid, { role: 'it', note: true, tools: [],
                  text: `没能停止：${d.error || '未知'} —— 它可能还在跑` });
      break;
    case 'link.status':
      S.agents[pid] = { ...(S.agents[pid] || {}), status: d.status, error: d.error };
      paintConn();          // 任何一个程序的状态变了，都可能是地址的问题
      if (d.status === 'error' && pid === S.pid) {
        push(pid, { role: 'it', text: `还没连上：${d.error || ''}`, tools: [] });
      }
      /* 连接断了/关掉了：那一轮跟着没了，闸门必须开回去 —— 否则界面永久
         停在「运行中」，而它看起来只是「不理人」。
         但 `error` 并不都等于「连接没了」：重新声明能力面失败时也会发一条
         `error`（scope='declare'），那时 Link 仍 ready、这一轮**还在跑**。
         按断线处理会把「停止」变回「发送」、让「…」消失、并放行下一次提交
         （它必被「上一轮还没结束」拒掉，草稿再回填）——用户当场失去停下来的入口。 */
      const gone = d.status === 'closed' || (d.status === 'error' && d.scope !== 'declare');
      if (gone) setPhase(pid, 'linkDown');
      break;
    case 'session.changed': {
      // 别的窗口切了会话：这边跟着切。**不轮询** —— 事件总线本来就在广播。
      S.sid[pid] = d.sid || S.sid[pid];
      S.agents[pid] = { ...(S.agents[pid] || {}), title: d.title || '' };
      if (pid === S.pid) {
        const b = $('#sessbtn');
        if (b) b.title = d.title ? `当前会话：${d.title}` : '会话：新建 / 切换 / 改名 / 删除';
        reloadThread(pid, S.sid[pid]);
      }
      return;
    }
    case 'dev.changed': {
      const p = prog(pid); if (p) p.dev = !!(d && d.dev);
      paintDev(pid, !!(d && d.dev));
      return;
    }
    case 'plugin.loaded':
    case 'plugin.removed':
      loadState().then(() => { paintRail(); paintStage(S.pid === null); });
      return;
    default:
      return;
  }
  paintConn();
  if (pid === S.pid) paintThread();
}

/* 谁的能力，就报谁的名字：开发者模式下，一个程序借来的手仍然是小助理的手，
   工具卡上写「小助理 · write」比写「心情日记 · write」诚实。 */
function labelOf(pid, wire) {
  for (const p of (S.devtools ? [...S.programs, S.devtools] : S.programs)) {
    const f = (p.functions || []).find((x) => x.name === wire);
    if (f) return `${p.icon || ''} ${p.title} · ${f.fn}`.trim();
  }
  return wire;
}

/* 订阅建立（含断线重连）时补齐历史。
   事件是广播 —— 页面晚加载一秒、SSE 断过一下，错过就是错过。
   所以这里以 /api/state 里的历史为准做一次对齐，而不是指望一条都没漏。
   正在跑的那一轮不覆盖：事件此刻还在往里写。 */
async function syncAgents() {
  // await 会把控制权交还给 SSE。快照是在 await **之前**取的，所以这期间可能已经
  // 推进了一轮：那时快照里的 busy 还是 false，盖下去等于把刚到的消息和转圈一起抹掉。
  // 判据：这个 pid 的 tick 变过，就跳过它 —— 让事件流继续负责这一轮。
  const tick0 = { ...S.tick };
  const st = await fetch('/api/state').then((r) => r.json()).catch(() => null);
  if (!st) return;
  for (const [pid, a] of Object.entries(st.agents || {})) {
    if ((S.tick[pid] || 0) !== (tick0[pid] || 0)) continue;
    S.agents[pid] = { status: a.status, error: a.error, busy: a.busy };
    S.sid[pid] = a.sid || S.sid[pid];
    // 快照是权威：它说空闲就一定空闲（错过终态时这是唯一的出路），
    // 它说忙就跟着忙（另一个窗口在跑，这边也该能停）。
    setPhase(pid, { type: 'snapshot', busy: !!a.busy });
    if (S.busy[pid]) continue;
    S.msgs[pid] = groupRetracted((a.history || []).map((h) => ({
      role: h.role === 'user' ? 'me' : 'it', text: h.text || '', tools: [],
      files: h.files || [],
      turn: h.turn || '', retracted: !!h.retracted,
    })));
    S.cur[pid] = null;
  }
  paintRail();
  paintThread();
  paintConn();
}

/* ------------------------------------------------------------------ 设置 */
/* 设置有两项：**连哪个道**（aaas-service 地址）与**什么外观**（深/浅）。
   两项都属于整个工作区 —— 所以放在左下角，不混进程序那一列。 */

/* ------------------------------------------------------------ 外观（深/浅） */
/* 三档：auto / dark / light。**解析只有一处**（resolveTheme）：CSS 里只认
   <html data-theme="dark|light">，「到底画哪一档」全由这里决定 —— 见 CSS 里
   那段注释说的「两条判据并存迟早要出事」。 */
const THEME_KEY = 'aw-theme';
let themeOpening = null;      // 打开面板时的那一档；非 null = 有没保存的预览
let themeReported = null;     // 上一次告诉宿主的是哪一档（重复报等于把信号埋进噪音）

function resolveTheme(pref) {
  if (pref === 'dark' || pref === 'light') return pref;
  return window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches
    ? 'light' : 'dark';
}

/* 贴上去、记进缓存、把三档的选中态画对。返回值是**真正落地的**那一档
   （auto 会被解析成 dark/light）—— 调用方需要时不用再算一遍。 */
function applyTheme(pref) {
  const p = (pref === 'dark' || pref === 'light') ? pref : 'auto';
  if (S.settings) S.settings.theme = p;
  const t = resolveTheme(p);
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_KEY, t); } catch (e) { /* 存不上就算了，不影响画 */ }
  paintThemeSeg();
  reportTheme(p, t);
  return t;
}

/* 把「auto 到底解析成了什么」报回宿主。**只有页面知道系统深浅**（matchMedia 是
   页面的能力），所以这条 POST 是那个值进入宿主的唯一入口 —— 后端、插件 iframe、
   原生窗口都靠它答得上「现在该画哪一档」。
   预览（themeOpening != null）不报：那是还没保存的一眼，报上去等于让所有插件
   跟着一次没落盘的点击翻面。 */
function reportTheme(pref, resolved) {
  if (themeOpening != null || resolved === themeReported) return;
  themeReported = resolved;
  fetch('/api/theme/resolved', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ pref: pref, resolved: resolved })
  }).catch(() => { /* 宿主不在：下次 state 到了会再报一遍 */ });
}

function paintThemeSeg() {
  const box = $('#themeseg');
  if (!box) return;
  const cur = (S.settings && S.settings.theme) || 'auto';
  for (const b of box.querySelectorAll('button')) {
    const on = b.dataset.themePref === cur;
    b.classList.toggle('on', on);
    b.setAttribute('aria-checked', on ? 'true' : 'false');
  }
}

/* auto 档要**实时**跟随系统：不监听的话，人切了系统主题、页面一动不动，
   会以为这个设置坏了。显式选了深/浅的人不该被这条事件动到。 */
if (window.matchMedia) {
  const mq = matchMedia('(prefers-color-scheme: light)');
  const onSysTheme = () => {
    if (((S.settings && S.settings.theme) || 'auto') === 'auto') applyTheme('auto');
  };
  if (mq.addEventListener) mq.addEventListener('change', onSysTheme);
  else if (mq.addListener) mq.addListener(onSysTheme);   // 老引擎兜底
}
function setHint(text, cls) {
  const el = $('#setmsg');
  if (!el) return;
  el.textContent = text || '';
  el.className = 'hint' + (cls ? ' ' + cls : '');
}

function openSettings() {
  const m = $('#mask');
  if (!m) return;
  themeOpening = (S.settings && S.settings.theme) || 'auto';   // 取消要能还原
  m.classList.add('on');
  m.setAttribute('aria-hidden', 'false');
  $('#aaasurl').value = (S.settings && S.settings.url) || '';
  paintThemeSeg();
  setHint('');
  paintConn();
  $('#aaasurl').focus();
  $('#aaasurl').select();
}

/* 关面板 = 放弃还没保存的外观改动。外观是「点一下就变」的（不然得先保存才能
   看一眼，那就不叫预览了），所以预览与已保存之间必须有一条退路；地址不用退 ——
   它只在保存那一刻才生效。 */
function closeSettings() {
  const m = $('#mask');
  if (!m) return;
  if (themeOpening != null) { applyTheme(themeOpening); themeOpening = null; }
  m.classList.remove('on');
  m.setAttribute('aria-hidden', 'true');
}

/* 保存 = 落盘 + 立刻按新地址重连。地址错在这里就报，别让人对着一个
   「好像连不上」的界面猜。 */
async function saveSettings(e) {
  if (e) e.preventDefault();
  const btn = $('#setsave');
  const url = $('#aaasurl').value.trim();
  const theme = (S.settings && S.settings.theme) || 'auto';
  const oldUrl = (S.settings && S.settings.url) || '';
  btn.disabled = true;
  setHint('保存中…');
  const r = await fetch('/api/settings', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ url, theme }),
